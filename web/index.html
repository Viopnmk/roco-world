/* ============ 阵容推荐（#/squads） ============ */
/* 流派与天气证据全部来自对 skills.json 的全量扫描（技能/特性 desc 原文），
   不是外部攻略：本作共有 5 种可由技能改写的天气——暴风雪、雨天、沙暴、
   雷鸣、霞光梦境（另有「晴天」在本作不存在）。其中霞光梦境全库没有任何
   技能/特性引用它的收益，证据不足，不组队；其余 4 种各有明确的开天气招
   与受益条目，按「天气手 1–2 + 受益者优先 + 同系输出 + 补盲」组队。
   天气证据（设定招均为变化类「将天气改为 X，持续 8 回合」）：
   - 暴风雪：冬至 / 特性·高吹雪 开天气；特性·冰雪魂魄（冰系威力+100%）、
     特性·环天顶弧、雪原狩猎（威力+50）受益。
   - 雨天：落雨 开天气；特性·滴眼液（水系吸血 100%）、特性·得寸进尺
     （双攻+100%）、沉溺（能耗-2）、汇流（延长雨天）受益。
   - 沙暴：沙涌 开天气；特性·流沙统治者（速度+50）、扬尘（先手+1）受益。
   - 雷鸣：惊雷 开天气；特性·电子音乐（电系技能后挂引电）受益。
   兜底流派：火系队（单系池 62 只）、高速队（速度线 + 先手/迅捷招）、
   坦克队（高体力/双防 + 真回复类续航招）。全部阵容用贪心从 662 只里选，
   同一进化家族只取一只（familyOf 的 key 去重），评分复用配队页 scoreTeam。 */
var WEATHER_DEFS = [
  { id: "snow", name: "雪天队", weather: "暴风雪", type: "冰", setterSkills: ["冬至"], setterAbilities: ["高吹雪"],
    beneAbilities: ["冰雪魂魄", "环天顶弧"], beneSkills: ["雪原狩猎"], emoji: "❄️" },
  { id: "rain", name: "雨天队", weather: "雨天", type: "水", setterSkills: ["落雨"], setterAbilities: [],
    beneAbilities: ["滴眼液", "得寸进尺"], beneSkills: ["沉溺", "汇流"], emoji: "🌧️" },
  { id: "sand", name: "沙暴队", weather: "沙暴", type: "地", setterSkills: ["沙涌"], setterAbilities: [],
    beneAbilities: ["流沙统治者"], beneSkills: ["扬尘"], emoji: "🏜️" },
  { id: "thunder", name: "雷鸣队", weather: "雷鸣", type: "电", setterSkills: ["惊雷"], setterAbilities: [],
    beneAbilities: ["电子音乐"], beneSkills: [], emoji: "⛈️" }
];
var squads = { cache: null, openId: "", notice: "", rot: null, rotState: "idle", rotList: [] };

function descFirst(desc){
  var d = String(desc || "");
  var i = d.indexOf("。");
  var s = i >= 0 ? d.slice(0, i + 1) : d;
  return s.length > 46 ? s.slice(0, 46) + "…" : s;
}
function petHasSkill(pet, name){
  return petSkills(pet).some(function(sk){ return sk.name === name; });
}
function squadFamKey(pet){
  var f = familyOf(pet);
  return f ? "fam:" + f.key : "solo:" + pet.id;
}
function newSquadState(){ return { members: [], fams: {}, ids: {}, sps: {} }; }
function squadAdd(st, pet, role, why){
  st.members.push({ pet: pet, role: role, why: why });
  st.fams[squadFamKey(pet)] = 1;
  st.ids[pet.id] = 1;
  st.sps[pet.species || pet.name] = 1;
}
/* 去重口径：同一进化家族只取一只，且同一物种的不同样子/分支
   （如鳗尾兽与鳗尾兽（果壳铃的样子），species 相同）也只取一只 */
function squadAvail(st, pet){
  return !st.ids[pet.id] && !st.fams[squadFamKey(pet)] && !st.sps[pet.species || pet.name];
}
function greedyPick(st, cands, scoreFn){
  var best = null, bs = -Infinity;
  cands.forEach(function(p){
    if (!squadAvail(st, p)) return;
    var s = scoreFn(p);
    if (s > bs || (s === bs && best && p.id < best.id)) { bs = s; best = p; }
  });
  return best;
}
function outScore(pet){
  return Math.max(pet.stats.atk, pet.stats.spa) * 1.2 + pet.stats.total * 0.35;
}
function bestOwnMove(pet){
  var best = null;
  petSkills(pet).forEach(function(sk){
    if (sk.power == null || pet.types.indexOf(sk.type) < 0) return;
    if (sk.category !== "物理" && sk.category !== "魔法") return;
    if (!best || sk.power > best.power) best = sk;
  });
  return best;
}
function weakCounts(pets){
  var wc = {};
  TYPES18.forEach(function(a){
    var c = 0;
    pets.forEach(function(p){ if (typeMult(a, p.types) > 1) c++; });
    wc[a] = c;
  });
  return wc;
}
function superCountOf(pets){
  var atk = teamAtkTypes(pets);
  return TYPES18.filter(function(d){ return bestMult(atk, [d]) >= 2; }).length;
}
/* 补盲选人：新增超效打击面 + 反打全队最怕的属性 + 面板，返回 {pet, why} */
function blindPick(st){
  var cur = st.members.map(function(m){ return m.pet; });
  var wc = weakCounts(cur);
  var maxW = Math.max.apply(null, TYPES18.map(function(a){ return wc[a]; }));
  var weakTops = TYPES18.filter(function(a){ return wc[a] === maxW && maxW > 0; });
  var curSuper = superCountOf(cur);
  var best = null, bs = -Infinity, bWhy = "";
  DB.pets.forEach(function(p){
    if (!squadAvail(st, p)) return;
    var atk = petAtkTypes(p);
    var newSuper = superCountOf(cur.concat([p])) - curSuper;
    var anti = weakTops.filter(function(w){ return atk.some(function(t){ return typeMult(t, [w]) >= 2; }); });
    var s = newSuper * 12 + anti.length * 10 + p.stats.total / 40;
    if (s > bs) {
      bs = s; best = p;
      var bits = [];
      if (anti.length) bits.push("它的技能能 ×2 打 " + anti.join("、") + "系，正克全队最怕的属性");
      if (newSuper > 0) bits.push("新增超效打击面 " + newSuper + " 种");
      if (!bits.length) bits.push("面板扎实，总和 " + p.stats.total + "，补上队伍短板");
      bWhy = "补盲：" + bits.join("；") + "。";
    }
  });
  return best ? { pet: best, why: bWhy } : null;
}
function fillBlind(st, count){
  for (var i = 0; i < count && st.members.length < 6; i++) {
    var r = blindPick(st);
    if (!r) break;
    squadAdd(st, r.pet, "🧭 补盲", r.why);
  }
}
/* 天气证据判定：返回证据字符串或 null */
function setterEvidence(pet, w){
  for (var i = 0; i < w.setterSkills.length; i++) {
    if (petHasSkill(pet, w.setterSkills[i])) {
      var sk = skillOf(w.setterSkills[i]);
      return "会开天气招「" + w.setterSkills[i] + "」——" + descFirst(sk ? sk.desc : "");
    }
  }
  for (var j = 0; j < w.setterAbilities.length; j++) {
    if (pet.ability === w.setterAbilities[j]) {
      var ab = DB.abilityByName[w.setterAbilities[j]];
      return "特性「" + w.setterAbilities[j] + "」能开天气——" + descFirst(ab ? ab.desc : "");
    }
  }
  return null;
}
function beneEvidence(pet, w){
  for (var i = 0; i < w.beneAbilities.length; i++) {
    if (pet.ability === w.beneAbilities[i]) {
      var ab = DB.abilityByName[w.beneAbilities[i]];
      return { kind: "ability", text: "特性「" + w.beneAbilities[i] + "」——" + descFirst(ab ? ab.desc : "") };
    }
  }
  for (var j = 0; j < w.beneSkills.length; j++) {
    if (petHasSkill(pet, w.beneSkills[j])) {
      var sk = skillOf(w.beneSkills[j]);
      return { kind: "skill", text: "会「" + w.beneSkills[j] + "」——" + descFirst(sk ? sk.desc : "") };
    }
  }
  return null;
}
function outputWhy(pet, tag){
  var mv = bestOwnMove(pet);
  var side = pet.stats.atk >= pet.stats.spa ? "物攻 " + pet.stats.atk : "魔攻 " + pet.stats.spa;
  return (tag || "核心输出") + "：" + side + "，总和 " + pet.stats.total +
    (mv ? "，本系大招「" + mv.name + "」威力 " + mv.power : "") + "。";
}

function buildWeatherSquad(w){
  var st = newSquadState();
  var setters = DB.pets.filter(function(p){ return setterEvidence(p, w); });
  var setter = greedyPick(st, setters, function(p){
    return p.stats.total + (p.types.indexOf(w.type) >= 0 ? 40 : 0);
  });
  var setterIsBene = false;
  if (setter) {
    setterIsBene = !!beneEvidence(setter, w);
    squadAdd(st, setter, "🌦️ 天气手" + (setterIsBene ? " · ✨ 受益" : ""),
      setterEvidence(setter, w) + "（" + w.weather + "队的天气发动机，总和 " + setter.stats.total + "）。");
  }
  var beneNeed = 2 - (setterIsBene ? 1 : 0);
  var benes = DB.pets.filter(function(p){ return beneEvidence(p, w); });
  for (var i = 0; i < beneNeed; i++) {
    var b = greedyPick(st, benes, function(p){
      var ev = beneEvidence(p, w);
      return p.stats.total + (ev && ev.kind === "ability" ? 80 : 30);
    });
    if (!b) break;
    squadAdd(st, b, "✨ 天气受益", "在" + w.weather + "下直接受益：" + beneEvidence(b, w).text + "（总和 " + b.stats.total + "）。");
  }
  var attackers = DB.pets.filter(function(p){ return p.types.indexOf(w.type) >= 0; });
  var core = greedyPick(st, attackers, outScore);
  if (core) squadAdd(st, core, "⚔️ 核心输出", outputWhy(core, w.type + "系核心输出"));
  var core2 = greedyPick(st, attackers, outScore);
  if (core2) squadAdd(st, core2, "⚔️ 核心输出", outputWhy(core2, w.type + "系输出"));
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function buildFireSquad(){
  var st = newSquadState();
  var fires = DB.pets.filter(function(p){ return p.types.indexOf("火") >= 0; });
  var first = greedyPick(st, fires, outScore);
  if (first) squadAdd(st, first, "⚔️ 核心输出", outputWhy(first, "火系头号输出"));
  var firstPhys = first && first.stats.atk >= first.stats.spa;
  var second = greedyPick(st, fires, function(p){
    var opp = firstPhys ? (p.stats.spa > p.stats.atk ? 60 : 0) : (p.stats.atk > p.stats.spa ? 60 : 0);
    return outScore(p) + opp;
  });
  if (second) squadAdd(st, second, "⚔️ 核心输出", outputWhy(second, "火系输出（与头号位错开物/魔侧）"));
  var third = greedyPick(st, fires, outScore);
  if (third) squadAdd(st, third, "⚔️ 核心输出", outputWhy(third, "火系输出"));
  var wall = greedyPick(st, fires, function(p){ return p.stats.hp + p.stats.def + p.stats.spd; });
  if (wall) squadAdd(st, wall, "🛡️ 前排坦克",
    "火系里最能扛：体力 " + wall.stats.hp + "、物防 " + wall.stats.def + "、魔防 " + wall.stats.spd + "，总和 " + wall.stats.total + "，顶在前面给输出腾回合。");
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function hasPrioMove(pet){
  return petSkills(pet).some(function(sk){
    var d = sk.desc || "";
    return (d.indexOf("先手+1") >= 0 || d.indexOf("迅捷") >= 0) && d.indexOf("先手-1") < 0;
  });
}
function prioMoveName(pet){
  var hit = null;
  petSkills(pet).forEach(function(sk){
    var d = sk.desc || "";
    if (!hit && (d.indexOf("先手+1") >= 0 || d.indexOf("迅捷") >= 0) && d.indexOf("先手-1") < 0) hit = sk;
  });
  return hit;
}
function buildSpeedSquad(){
  var st = newSquadState();
  var fast = DB.pets.filter(function(p){ return p.stats.spe >= 100; });
  for (var i = 0; i < 5; i++) {
    var p = greedyPick(st, fast, function(x){
      return x.stats.spe * 3 + x.stats.total * 0.3 + (hasPrioMove(x) ? 45 : 0);
    });
    if (!p) break;
    var pm = prioMoveName(p);
    squadAdd(st, p, i === 0 ? "🚀 先手核心" : "💨 高速输出",
      "速度 " + p.stats.spe + "（全图鉴前列），总和 " + p.stats.total +
      (pm ? "，还会先手/迅捷招「" + pm.name + "」，出手顺序再往前抢" : "，靠速度线先手压血") + "。");
  }
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function isSustainSkill(sk){
  /* 续航招口径（真回复）：变化类，且描述为回复生命/体力或吸血。
     不算的：满图鉴普及的「减伤应对」姿态招（几乎人手一打、不区分队伍），
     以及只回复能量的「回复」（须与生命/体力同现才算）。 */
  if (sk.category !== "变化") return false;
  var d = sk.desc || "";
  if (d.indexOf("吸血") >= 0) return true;
  var healWord = d.indexOf("回复") >= 0 || d.indexOf("恢复") >= 0 || d.indexOf("回血") >= 0 || d.indexOf("治疗") >= 0;
  return healWord && (d.indexOf("生命") >= 0 || d.indexOf("体力") >= 0);
}
function sustainSkillsOf(pet){
  return petSkills(pet).filter(isSustainSkill);
}
function sustainExample(pet){
  /* 展示用例子：优先挑描述里带「生命」的，最能代表续航 */
  var list = sustainSkillsOf(pet);
  if (!list.length) return null;
  var heal = list.filter(function(sk){ return (sk.desc || "").indexOf("生命") >= 0; });
  return (heal.length ? heal : list)[0];
}
function duraOf(pet){ return pet.stats.hp + pet.stats.def + pet.stats.spd; }
function buildTankSquad(){
  var st = newSquadState();
  var bulky = DB.pets.filter(function(p){ return duraOf(p) >= 380; });
  for (var i = 0; i < 2; i++) {
    var t = greedyPick(st, bulky, function(p){
      return duraOf(p) + sustainSkillsOf(p).length * 20;
    });
    if (!t) break;
    var susEx = sustainExample(t);
    squadAdd(st, t, i === 0 ? "🛡️ 主坦" : "🛡️ 副坦",
      "耐久担当：体力 " + t.stats.hp + "、物防 " + t.stats.def + "、魔防 " + t.stats.spd +
      (susEx ? "，带续航招「" + susEx.name + "」" : "") + "，总和 " + t.stats.total + "。");
  }
  for (var j = 0; j < 2; j++) {
    var s2 = greedyPick(st, DB.pets, function(p){
      var n = sustainSkillsOf(p).length;
      if (!n) return -1;
      return duraOf(p) * 0.7 + n * 30 + p.stats.total * 0.2;
    });
    if (!s2) break;
    var sus2 = sustainSkillsOf(s2);
    var sus2Ex = sustainExample(s2);
    squadAdd(st, s2, "💚 续航核心",
      "带 " + sus2.length + " 个真回复技能（如「" + (sus2Ex ? sus2Ex.name : sus2[0].name) + "」），体力 " + s2.stats.hp +
      "、双防 " + s2.stats.def + "/" + s2.stats.spd + "，负责把战斗拖进持久战。");
  }
  for (var k = 0; k < 2; k++) {
    var o = greedyPick(st, bulky, outScore);
    if (!o) break;
    squadAdd(st, o, "⚔️ 耐久输出", outputWhy(o, "能扛能打") + "耐久（体力+双防）" + duraOf(o) + "，不会被一波带走。");
  }
  fillBlind(st, 6 - st.members.length);
  return st.members;
}


/* ============ 配合模型（第 7 期）：证据表 + 配合分 + 配合链 ============ */
/* 以下名单全部来自对 skills.json 全部 861 条 desc 的语义扫描（见 README
   「配合模式统计」），不是外部攻略：
   - 星陨印记：幻系有一整套挂印记招（超维投射/星轨裂变挂 2–4 层），消费端有
     特性坠星（每层威力+20%）、观星、守望星与多维击打（每层连击+1）等；
   - 奉献：虫系为核心的队伍共享增益池，产出 18 条、消费端是虫群/啃咬；
   - 能量：富养化/养分回流给场下全队回能，加大功率给接棒者 +8，另有一族
     「入场前蓄势」特性（地脉/结晶水/散热/盘根木/慢热型）靠队友行动充能；
   - 吸血：蝙蝠/贪婪/撕裂等吸血招 + 渴求/贪得无厌/盛宴等吸血特性，跨系分布；
   - 首领形态：进化链 lords 共 68 只。配合链的每条出处（特性/技能名）都由
     下面的判定函数从该精灵的真实数据里取出，页面断言会逐条复核。 */
var MARK_APPLY_SKILLS = ["超维投射", "星轨裂变", "星链", "超新星馈赠", "二律背反", "心灵洞悉", "空间压迫", "量子涨落", "冥想", "错乱", "奇点"];
var MARK_APPLY_TRAITS = ["吸积盘", "乌龟塔理论", "月牙雪糕"];
var MARK_USE_TRAITS = ["坠星", "观星", "守望星", "与星星同行", "宇宙之眼", "和弦共振"];
var MARK_USE_SKILLS = ["多维击打", "天体吸积", "星痕", "四维降解"];
var OFFER_MAKE_TRAITS = ["花精灵", "振奋虫心", "坚韧铠甲", "虫草多糖", "扫拖一体"];
var OFFER_MAKE_SKILLS = ["夏蛰", "虫群智慧", "虫结阵", "信息素", "振翅", "飞断", "虫群过境", "虫茧"];
var OFFER_USE_SKILLS = ["虫群", "啃咬"];
var ENERGY_FEED_SKILLS = ["富养化", "养分回流", "加大功率"];
var CHARGE_TRAITS = { "地脉": "地", "地脉馈赠": "地", "结晶水": "冰", "散热": "火", "盘根木": "草", "慢热型": null };
var DRAIN_TRAITS = ["渴求", "贪得无厌", "盛宴", "异类"];
var DRAIN_SKILLS = ["蝙蝠", "贪婪", "撕裂", "暗突袭", "等价交换", "困兽", "汲取", "龙之利爪"];

function petSkillNameSet(pet){
  if (pet._skn) return pet._skn;
  var s = {};
  petSkills(pet).forEach(function(sk){ s[sk.name] = 1; });
  pet._skn = s;
  return s;
}
/* 证据条目 {n: 名称, k: "技能"|"特性"}：技能必须在该精灵 learnset 里、
   特性必须就是该精灵的特性字段，判定天然成立 */
function evList(pet, skillNames, traitNames){
  var have = petSkillNameSet(pet), out = [];
  skillNames.forEach(function(n){ if (have[n]) out.push({ n: n, k: "技能" }); });
  if (pet.ability && traitNames.indexOf(pet.ability) >= 0) out.push({ n: pet.ability, k: "特性" });
  return out;
}
function markApplyOf(pet){ return evList(pet, MARK_APPLY_SKILLS, MARK_APPLY_TRAITS); }
function markUseOf(pet){ return evList(pet, MARK_USE_SKILLS, MARK_USE_TRAITS); }
function offerMakeOf(pet){ return evList(pet, OFFER_MAKE_SKILLS, OFFER_MAKE_TRAITS); }
function offerUseOf(pet){ return evList(pet, OFFER_USE_SKILLS, []); }
function energyFeedOf(pet){ return evList(pet, ENERGY_FEED_SKILLS, []); }
function drainOf(pet){ return evList(pet, DRAIN_SKILLS, DRAIN_TRAITS); }
function chargeTypeOf(pet){
  if (!pet.ability || !Object.prototype.hasOwnProperty.call(CHARGE_TRAITS, pet.ability)) return undefined;
  return CHARGE_TRAITS[pet.ability];
}
function bigMovesOf(pet, minE){
  return petSkills(pet).filter(function(sk){
    return sk.power != null && (sk.energy || 0) >= minE;
  }).sort(function(a, b){ return (b.energy - a.energy) || (b.power - a.power); });
}
/* 展示用大招：能耗 ≥30 的招（如抛石★30）是数据异常值——只有这种招的
   精灵不算大招手；展示与选人只取能耗 ≤10 里最贵的一招，没有则返回 null */
function displayBigMove(pet, minE){
  var list = bigMovesOf(pet, minE);
  for (var i = 0; i < list.length; i++) if ((list[i].energy || 0) <= 10) return list[i];
  return null;
}
function stPets(st){ return st.members.map(function(m){ return m.pet; }); }
function evNames(list){ return list.map(function(e){ return "「" + e.n + "」"; }).join("、"); }

/* 配合标志位（缓存）：配合分与各构建器共用，避免重复扫技能池 */
function petFlags(pet){
  if (pet._flg) return pet._flg;
  var f = {
    apply: markApplyOf(pet).length > 0, use: markUseOf(pet).length > 0,
    off: offerMakeOf(pet).length > 0, offUse: offerUseOf(pet).length > 0,
    feed: energyFeedOf(pet).length > 0, big7: bigMovesOf(pet, 7).length > 0,
    drainN: drainOf(pet).length, charge: chargeTypeOf(pet)
  };
  pet._flg = f;
  return f;
}
/* 配合分：候选与已选成员之间存在可验证的配合关系时加分（与配合链同源） */
function synergyBonus(cand, memberPets){
  var b = 0, cf = petFlags(cand);
  var mApply = false, mUse = false, mOff = false, mOffUse = false, mBig = false, mFeed = false;
  memberPets.forEach(function(p){
    var f = petFlags(p);
    if (f.apply) mApply = true;
    if (f.use) mUse = true;
    if (f.off) mOff = true;
    if (f.offUse) mOffUse = true;
    if (f.big7) mBig = true;
    if (f.feed) mFeed = true;
  });
  if (cf.apply && mUse) b += 70;
  if (cf.use && mApply) b += 70;
  if (cf.off && mOffUse) b += 60;
  if (cf.offUse && mOff) b += 60;
  if (cf.off) b += 12;
  if (cf.feed && mBig) b += 50;
  if (cf.big7 && mFeed) b += 50;
  if (cf.charge !== undefined) {
    if (cf.charge === null) b += 30;
    else if (memberPets.some(function(p){ return petAtkTypes(p).indexOf(cf.charge) >= 0; })) b += 40;
  }
  if (cf.drainN >= 2) b += 15;
  return b;
}

function makeLink(kind, aPet, ev, bPet, text){
  var src = ev.k === "特性" ? DB.abilityByName[ev.n] : skillOf(ev.n);
  return { kind: kind, a: aPet.name, via: ev.n, viaKind: ev.k,
    b: bPet ? bPet.name : "全队", text: text, quote: descFirst(src ? src.desc : "") };
}
function setterEvObj(pet, w){
  for (var i = 0; i < w.setterSkills.length; i++)
    if (petHasSkill(pet, w.setterSkills[i])) return { n: w.setterSkills[i], k: "技能" };
  for (var j = 0; j < w.setterAbilities.length; j++)
    if (pet.ability === w.setterAbilities[j]) return { n: w.setterAbilities[j], k: "特性" };
  return null;
}
function beneEvObj(pet, w){
  for (var i = 0; i < w.beneAbilities.length; i++)
    if (pet.ability === w.beneAbilities[i]) return { n: w.beneAbilities[i], k: "特性" };
  for (var j = 0; j < w.beneSkills.length; j++)
    if (petHasSkill(pet, w.beneSkills[j])) return { n: w.beneSkills[j], k: "技能" };
  return null;
}

/* 配合链：从一支已组好的队伍里提取可验证的配合关系（每套取 2–4 条）。
   每条的 via 都由上面的判定函数从成员真实数据里取出，断言会逐条复核：
   viaKind=特性 ⇒ 该精灵 ability 字段；viaKind=技能 ⇒ 在其 learnset 里。 */
function squadLinks(def, members){
  var pets = members.map(function(m){ return m.pet; });
  var found = [];
  function push(kind, aPet, ev, bPet, text){ if (ev) found.push(makeLink(kind, aPet, ev, bPet, text)); }
  /* 天气：天气手 → 受益者 */
  if (def.weather) {
    var w = null;
    WEATHER_DEFS.forEach(function(x){ if (x.weather === def.weather) w = x; });
    if (w) {
      var setter = null;
      pets.forEach(function(p){ if (!setter && setterEvObj(p, w)) setter = p; });
      if (setter) {
        var sev = setterEvObj(setter, w);
        pets.forEach(function(p){
          if (p === setter) return;
          var be = beneEvObj(p, w);
          if (be) push("weather", setter, sev, p,
            "把天气改成" + def.weather + "，" + p.name + "的" + be.k + "「" + be.n + "」随之生效，天气在场它就一直受益");
        });
      }
    }
  }
  /* 印记：施加者 → 消费者（特性消费优先） */
  var markPairs = [];
  pets.forEach(function(a){
    var ap = markApplyOf(a);
    if (!ap.length) return;
    pets.forEach(function(b){
      if (b === a) return;
      var us = markUseOf(b);
      if (!us.length) return;
      var uev = us.filter(function(e){ return e.k === "特性"; })[0] || us[0];
      markPairs.push({ a: a, aev: ap[0], b: b, uev: uev, trait: uev.k === "特性" ? 1 : 0 });
    });
  });
  markPairs.sort(function(x, y){ return y.trait - x.trait; });
  markPairs.forEach(function(pr){
    push("mark", pr.a, pr.aev, pr.b,
      "先给敌方叠上星陨印记，" + pr.b.name + "的" + pr.uev.k + "「" + pr.uev.n + "」按印记层数放大收益——层数叠得越高，引爆越疼");
  });
  /* 奉献：产出者 → 消费者；没有消费者时 → 全队共享池 */
  var offerConsumers = pets.filter(function(p){ return offerUseOf(p).length > 0; });
  pets.forEach(function(a){
    var mk = offerMakeOf(a);
    if (!mk.length) return;
    if (offerConsumers.length) {
      offerConsumers.forEach(function(b){
        if (b === a) return;
        push("offering", a, mk[0], b,
          "攒出的奉献会增益" + b.name + "的「" + offerUseOf(b)[0].n + "」这类受奉献影响的技能（威力/连击等），产出位打得越勤它越强");
      });
    } else {
      push("offering", a, mk[0], null,
        "产出的奉献进入全队共享池，随机增益队友技能（威力/连击/吸血/减能耗等），全队轮换上场都能吃到");
    }
  });
  /* 能量：供能者 → 高能耗大招持有者 */
  pets.forEach(function(a){
    var fd = energyFeedOf(a);
    if (!fd.length) return;
    pets.forEach(function(b){
      if (b === a) return;
      var big = displayBigMove(b, 7);
      if (!big) return;
      push("energy", a, fd[0], b,
        "给场下/接棒的队友补能量，" + b.name + "的大招「" + big.name + "」（能耗★" + big.energy + "、威力 " + big.power + "）不怕断档");
    });
  });
  /* 能量（奉献减能耗）：假寐 → 大招持有者 */
  pets.forEach(function(a){
    if (!petSkillNameSet(a)["假寐"]) return;
    pets.forEach(function(b){
      if (b === a) return;
      var big = displayBigMove(b, 5);
      if (!big) return;
      push("energy", a, { n: "假寐", k: "技能" }, b,
        "让己方队伍获得奉献：能耗-2，" + b.name + "的大招「" + big.name + "」（能耗★" + big.energy + "）连发压力大减");
    });
  });
  /* 蓄势：入场前蓄能/蓄血特性 ← 全队的对应系别技能喂养 */
  pets.forEach(function(p){
    var ct = chargeTypeOf(p);
    if (ct === undefined) return;
    var feeders = pets.filter(function(q){
      return q !== p && (ct === null || petAtkTypes(q).indexOf(ct) >= 0);
    });
    if (!feeders.length) return;
    push("charge", p, { n: p.ability, k: "特性" }, null,
      ct === null
        ? "它还没入场就在蓄能：全队每成功应对 1 次，它入场前就回复 5 能量——队友打得越稳，它入场越满格"
        : "它还没入场就在蓄势：全队每用 1 次" + ct + "系技能都在为它充能/回血（队里有 " + feeders.length + " 只会" + ct + "系技能），入场就是满状态");
  });
  /* 吸血：自身连锁（吸血状态来源 + 吸血输出招同体） */
  pets.forEach(function(p){
    var dr = drainOf(p);
    if (dr.length < 2) return;
    var stateEv = dr.filter(function(e){ return e.n === "贪婪" || e.n === "等价交换" || e.k === "特性"; })[0];
    var atkEv = dr.filter(function(e){ return e !== stateEv && e.k === "技能"; })[0];
    if (!stateEv || !atkEv) return;
    push("drain", p, stateEv, p,
      "自身连锁：先靠" + stateEv.k + "「" + stateEv.n + "」挂上吸血，再用「" + atkEv.n + "」输出——打出的伤害按比例回血，越打越能扛");
  });
  /* 交接治疗：茶多酚 → 全队 */
  pets.forEach(function(p){
    if (p.ability === "茶多酚")
      push("heal", p, { n: "茶多酚", k: "特性" }, null,
        "它离场时，接棒入场的队友回复 20% 生命——轮换交接不掉血，残血位换下去、满血位顶上来");
  });
  var prio = { weather: 0, mark: 1, offering: 2, energy: 3, charge: 4, drain: 5, heal: 6 };
  var themeKind = { mark: "mark", offering: "offering", vampire: "drain", energy: "energy" }[def.id] || null;
  function effPrio(L){
    var p = prio[L.kind];
    if (themeKind && L.kind === themeKind) p -= 10;
    if (def.id === "energy" && L.kind === "charge") p -= 9;
    return p;
  }
  found.sort(function(x, y){ return effPrio(x) - effPrio(y); });
  var seen = {}, perKind = {}, out = [];
  found.forEach(function(L){
    var key = L.a + "|" + L.via + "|" + L.b;
    if (seen[key]) return;
    if ((perKind[L.kind] || 0) >= 2) return;
    if (out.length >= 4) return;
    seen[key] = 1; perKind[L.kind] = (perKind[L.kind] || 0) + 1;
    out.push(L);
  });
  return out;
}

/* ---- 第 7 期新流派构建器 ---- */
function buildMarkSquad(){
  var st = newSquadState();
  var consumers = DB.pets.filter(function(p){ return markUseOf(p).length > 0; });
  var core = greedyPick(st, consumers, function(p){
    return p.stats.total + markUseOf(p).length * 25 + markApplyOf(p).length * 20 + synergyBonus(p, stPets(st));
  });
  if (core) squadAdd(st, core, "🌠 引爆核心",
    "消费端拉满：它自己就能" + (markApplyOf(core).length ? "挂印记（" + evNames(markApplyOf(core).slice(0, 2)) + "）又能" : "") +
    "按层数引爆（" + evNames(markUseOf(core).slice(0, 3)) + "），队友叠的每层星陨印记都算它的弹药。总和 " + core.stats.total + "。");
  var appliers = DB.pets.filter(function(p){ return markApplyOf(p).length >= 2; });
  for (var i = 0; i < 2; i++) {
    var ap = greedyPick(st, appliers, function(p){
      return markApplyOf(p).length * 30 + p.stats.total * 0.5 + synergyBonus(p, stPets(st));
    });
    if (!ap) break;
    squadAdd(st, ap, "🔖 挂印记",
      "一场能叠多层星陨印记：" + evNames(markApplyOf(ap).slice(0, 3)) + "，负责把敌方身上的层数铺满，给引爆位递弹药。总和 " + ap.stats.total + "。");
  }
  var use2 = greedyPick(st, consumers, function(p){
    return p.stats.total * 0.8 + markUseOf(p).length * 25 + synergyBonus(p, stPets(st));
  });
  if (use2) squadAdd(st, use2, "✨ 印记受益",
    "第二个吃印记的位置：" + evNames(markUseOf(use2).slice(0, 2)) + "让它在印记层数高时收益翻倍，与引爆核心错开收割窗口。总和 " + use2.stats.total + "。");
  var out = greedyPick(st, DB.pets.filter(function(p){ return p.types.indexOf("幻") >= 0; }), function(p){
    return outScore(p) + synergyBonus(p, stPets(st));
  });
  if (out) squadAdd(st, out, "⚔️ 核心输出", outputWhy(out, "幻系输出"));
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function buildOfferingSquad(){
  var st = newSquadState();
  var pool = DB.pets.filter(function(p){ return offerMakeOf(p).length > 0 || offerUseOf(p).length > 0; });
  for (var i = 0; i < 4; i++) {
    var p = greedyPick(st, pool, function(x){
      return offerMakeOf(x).length * 25 + offerUseOf(x).length * 35 + x.stats.total * 0.45 + synergyBonus(x, stPets(st));
    });
    if (!p) break;
    var mk = offerMakeOf(p), us = offerUseOf(p);
    var role = us.length && mk.length ? "🪲 产出兼受益" : (mk.length ? "🪲 奉献产出" : "🎁 奉献受益");
    var why = "";
    if (mk.length) why += "能攒奉献：" + evNames(mk.slice(0, 3)) + "；";
    if (us.length) why += "能吃奉献：" + evNames(us) + "会被奉献增益；";
    why += "总和 " + p.stats.total + "。奉献是全队共享池，它在场越久，全队技能越强。";
    squadAdd(st, p, role, why);
  }
  var out = greedyPick(st, DB.pets.filter(function(p){ return p.types.indexOf("虫") >= 0; }), function(p){
    return outScore(p) + synergyBonus(p, stPets(st));
  });
  if (out) squadAdd(st, out, "⚔️ 核心输出", outputWhy(out, "虫系输出"));
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function buildVampireSquad(){
  var st = newSquadState();
  var rich = DB.pets.filter(function(p){ return drainOf(p).length >= 2; });
  for (var i = 0; i < 4; i++) {
    var p = greedyPick(st, rich, function(x){
      return drainOf(x).length * 60 + outScore(x) * 0.55 + synergyBonus(x, stPets(st));
    });
    if (!p) break;
    squadAdd(st, p, i === 0 ? "🧛 吸血核心" : "🩸 吸血输出",
      "带 " + drainOf(p).length + " 个吸血来源（" + evNames(drainOf(p).slice(0, 3)) + "），" +
      (p.stats.atk >= p.stats.spa ? "物攻 " + p.stats.atk : "魔攻 " + p.stats.spa) + "、总和 " + p.stats.total + "——打出去的伤害按比例变回自己的血。");
  }
  var wall = greedyPick(st, rich, function(p){ return duraOf(p); });
  if (wall) squadAdd(st, wall, "🛡️ 吸血坦克",
    "吸血位里最能扛：体力 " + wall.stats.hp + "、双防 " + wall.stats.def + "/" + wall.stats.spd +
    "，再带 " + drainOf(wall).length + " 个吸血来源，站场越久血越满。");
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function buildEnergySquad(){
  var st = newSquadState();
  var feeders = DB.pets.filter(function(p){ return energyFeedOf(p).length > 0; });
  var fd = greedyPick(st, feeders, function(p){
    return p.stats.total + energyFeedOf(p).length * 30 + synergyBonus(p, stPets(st));
  });
  if (fd) {
    var fsk = skillOf(energyFeedOf(fd)[0].n);
    squadAdd(st, fd, "🔋 供能手",
      "会「" + energyFeedOf(fd)[0].n + "」——" + descFirst(fsk ? fsk.desc : "") + "全队的能量水龙头，总和 " + fd.stats.total + "。");
  }
  var chargers = DB.pets.filter(function(p){ return chargeTypeOf(p) !== undefined; });
  var ace = greedyPick(st, chargers, function(p){
    return p.stats.total + synergyBonus(p, stPets(st));
  });
  if (ace) {
    var ab = DB.abilityByName[ace.ability];
    squadAdd(st, ace, "⚡ 蓄能王牌",
      "特性「" + ace.ability + "」——" + descFirst(ab ? ab.desc : "") + "队友在前面打，它在场下把能量蓄满，入场就是大招起手。总和 " + ace.stats.total + "。");
  }
  var spenders = DB.pets.filter(function(p){ return !!displayBigMove(p, 7); });
  for (var i = 0; i < 2; i++) {
    var sp = greedyPick(st, spenders, function(p){
      var big = displayBigMove(p, 7);
      return (big ? big.energy : 0) * 12 + outScore(p) * 0.5 + synergyBonus(p, stPets(st));
    });
    if (!sp) break;
    var big = displayBigMove(sp, 7);
    squadAdd(st, sp, "💥 大招手",
      "握着全队最贵的大招「" + big.name + "」（能耗★" + big.energy + "、威力 " + big.power + "）——平时放不起，靠这队的供能链才能连发。总和 " + sp.stats.total + "。");
  }
  var fd2 = greedyPick(st, feeders, function(p){ return p.stats.total * 0.8 + synergyBonus(p, stPets(st)); });
  if (fd2) squadAdd(st, fd2, "🔋 供能手",
    "第二路供能：「" + energyFeedOf(fd2)[0].n + "」保证能量链不断档，总和 " + fd2.stats.total + "。");
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function lordPets(){
  var seen = {}, out = [];
  DB.chains.forEach(function(ch){
    (ch.lords || []).forEach(function(l){
      if (seen[l.pet_id]) return;
      seen[l.pet_id] = 1;
      var p = DB.petById[l.pet_id];
      if (p) out.push(p);
    });
  });
  return out;
}
function lordEntryOf(pet){
  var f = familyOf(pet);
  if (!f || !f.lordList) return null;
  for (var i = 0; i < f.lordList.length; i++)
    if (f.lordList[i].pet_id === pet.id) return f.lordList[i];
  return null;
}
function buildLordSquad(){
  var st = newSquadState();
  var pool = lordPets();
  for (var i = 0; i < 6; i++) {
    var p = greedyPick(st, pool, function(x){
      return x.stats.total + synergyBonus(x, stPets(st)) * 1.2;
    });
    if (!p) break;
    var le = lordEntryOf(p);
    squadAdd(st, p, i === 0 ? "👑 首领王牌" : "👑 首领",
      "首领形态" + (le && le.item ? "（信物「" + le.item + "」）" : "") + "：总和 " + p.stats.total +
      "、特性「" + p.ability + "」，是全图鉴面板最顶上的一档，光种族值就能压对面一头。");
  }
  fillBlind(st, 6 - st.members.length);
  return st.members;
}

function squadPlaybook(def, members, met){
  var pets = members.map(function(m){ return m.pet; });
  var names = function(rolePart){
    return members.filter(function(m){ return m.role.indexOf(rolePart) >= 0; })
      .map(function(m){ return m.pet.name; });
  };
  var txt = "";
  if (def.weather) {
    var setter = members.filter(function(m){ return m.role.indexOf("天气手") >= 0; })[0];
    var benes = names("受益").filter(function(n){ return !setter || n !== setter.pet.name; });
    txt = "先手让" + (setter ? setter.pet.name : "天气手") + "把天气改成" + def.weather + "（持续 8 回合），" +
      (benes.length ? benes.join("、") + "在" + def.weather + "下拿到增益后接管输出；" : "同系输出跟着天气打；") +
      "天气断档前打完一轮爆发，天气手活着就能续上下一段天气。";
  } else if (def.id === "fire") {
    txt = "四只火系正面压火力，靠本系大招打克制面；前排坦克先吃一轮伤害，补盲位专门处理火系打不动的属性。全队打击面覆盖 " +
      met.superCount + "/18 种属性，平均种族值总和 " + Math.round(met.avgTotal) + "。";
  } else if (def.id === "speed") {
    txt = "全队平均速度 " + Math.round(met.avgSpe) + "，最快 " + met.fastest.name + " 速度 " + met.fastest.stats.spe +
      "，靠先手和先制招抢回合：先压血线、先挂状态，让对方核心没机会舒服出手；补盲位保证被速度克制的对局也有人能反打。";
  } else if (def.id === "tank") {
    txt = "六只平均耐久（体力+物防+魔防）" + Math.round(met.avgDura) + "，打法是拖：主坦吃伤害、续航位不断回血，" +
      "把比赛拖到对方能耗和血量见底，再用两只耐久输出收残局。全队打击面覆盖 " + met.superCount + "/18 种属性，不怕被单一属性通吃。";
  }
  if (def.id === "mark") {
    txt = "先让挂印记位把星陨印记叠满（超维投射、二律背反一挂就是 2–4 层），再换引爆核心收割：层数越高，多维击打的连击数和坠星的威力加成越夸张。" +
      "注意别让印记被驱散——层数清零这队就断档，挂印记位要轮换着续层。全队打击面覆盖 " + met.superCount + "/18 种属性。";
  } else if (def.id === "offering") {
    txt = "奉献是全队共享的增益池：产出位（虫群智慧、夏蛰一次给 2 次）先手攒奉献，受益位的虫群、啃咬这类技能会被奉献持续增益。" +
      "产出位轮换上场保持奉献不断档，打得越久全队技能越强，是越拖越肥的阵容。全队打击面覆盖 " + met.superCount + "/18 种属性。";
  } else if (def.id === "vampire") {
    txt = "吸血位打伤害就是回血：先挂吸血状态（贪婪/等价交换），再用蝙蝠、撕裂边打边回；血线越低，困兽、盛宴这类机制越强。" +
      "这队不怕消耗战，怕高爆发一波带走——遇到爆发队先用补盲位处理对面核心。全队打击面覆盖 " + met.superCount + "/18 种属性。";
  } else if (def.id === "energy") {
    txt = "供能手在场下给全队回能量，蓄能王牌靠队友的行动在入场前就蓄满，大招手进场直接放大招（能耗★7–10）——正常队伍放一次都费劲的大招，这队能连着放。" +
      "能量链就是命门：优先保护供能手，它倒了大招就哑火。";
  } else if (def.id === "lord") {
    txt = "六只全是首领形态，平均总和 " + Math.round(met.avgTotal) + "，打法就是面板压制：轮换硬吃伤害再反打，谁上场都是对面的难题。" +

  defs.push({ id: "tank", name: "坦克队", emoji: "🛡️", tag: "耐久 · 续航", members: buildTankSquad() });

  var blurbs = {
    snow: "冬至开暴风雪，冰雪魂魄让冰系威力翻倍的天气队。",
    rain: "落雨铺雨天，水系在雨里吸血、减能耗、双攻翻倍。",

    fire: "四只火系正面压上，坦克顶前排、补盲堵短板。",
    speed: "全员速度线拉满，靠先手和先制招抢回合。",
    mark: "幻系挂星陨印记叠层，引爆位按层数收割。",
    offering: "虫系攒奉献喂全队，越打越肥的共享增益池。",
    vampire: "跨属性吸血阵容：边打边回，专治消耗战。",
    energy: "场下供能 + 蓄能王牌，让 ★10 大招连着放。",
    lord: "六只首领形态组队，面板压制还自带配合链。",
    tank: "六只大肉带续航，把比赛拖进持久战。"
  };
  defs.forEach(function(d){
    var pets = d.members.map(function(m){ return m.pet; });
    var s = scoreTeam(pets, null);
    var wc = weakCounts(pets);
    var weakMax = Math.max.apply(null, TYPES18.map(function(a){ return wc[a]; }));
    var avgSpe = pets.reduce(function(x, p){ return x + p.stats.spe; }, 0) / pets.length;
    var avgDura = pets.reduce(function(x, p){ return x + duraOf(p); }, 0) / pets.length;
    var fastest = pets.slice().sort(function(a, b){ return b.stats.spe - a.stats.spe; })[0];
    d.score = s; d.blurb = blurbs[d.id] || "";
    d.links = squadLinks(d, d.members);
    d.met = { superCount: s.detail.superList.length, weakMax: weakMax,

      avgSpe: avgSpe, avgDura: avgDura, fastest: fastest,
      avgTotal: pets.reduce(function(x, p){ return x + p.stats.total; }, 0) / pets.length };
    var pb = squadPlaybook(d, d.members, d.met);
    d.play = pb.play; d.weak = pb.weak;

  squads.cache = defs;
  return defs;
}

function fmtDT(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso || "");
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function loadRotation(){
  loadJson("data/rotation.json", true).then(function(j){

        return s.members && s.members.length === 6 &&

      if (ok.length) {
        squads.rot = j; squads.rotList = ok; squads.rotState = "ok";
      } else squads.rotState = "error";
    } else squads.rotState = "error";
    if ((location.hash || "").indexOf("#/squads") === 0) renderSquads();
  });

    }).join("");
    html += '<div class="sq-detail">' + mems + linksHtml +
      '<h4 style="margin:12px 0 2px">队伍评分（与配队页同口径）</h4>' + rows +
      '<div class="cov-line">打击面覆盖 <b>' + s.detail.superList.length + "/18</b> 种属性能 ×2 克制 · 平均速度 <b>" +
      avgSpe + "</b> · 弱点 TOP：" +
      (weakTops.length ? weakTops.map(function(t){ return esc(t) + "系（" + weakMax + " 只被克）"; }).join("、") : "无集中弱点") + "</div>" +
      '<h4 style="margin:12px 0 2px">优势</h4>' + prosHtml +
      '<h4 style="margin:12px 0 2px">弱点</h4>' + consHtml + "</div>";
  }
  return html + "</section>";
}

function renderSquads(){
  var app = document.getElementById("app");
  var body;
  if (!DB.chart) {
    body = '<section class="blk"><h3>阵容推荐</h3><div class="desc">克制表数据（typechart.json）加载失败，暂时无法生成阵容。</div></section>';
  } else if (squads.rotState === "idle" || squads.rotState === "loading") {
    if (squads.rotState === "idle") { squads.rotState = "loading"; loadRotation(); }
    body = '<section class="blk"><h3>阵容推荐</h3><div class="desc">正在加载本轮阵容…</div></section>';
  } else if (squads.rotState === "error") {
    body = '<section class="blk"><h3>阵容推荐</h3><div class="desc">本轮阵容数据（rotation.json）暂时没加载出来，可能是网络问题或新一轮还在生成中。请稍后点下面按钮重试，或过一会儿再来。</div>' +
      '<div class="sq-actions"><button data-sq-retry="1">重新加载</button></div></section>';
  } else {
    var rot = squads.rot;
    var info = '<div class="sq-notice">🔄 第 ' + rot.round + ' 轮阵容 · 生成于 ' + fmtDT(rot.generatedAt) +
      ' · 下次自动更新 ' + fmtDT(rot.nextAt) + '（每 48 小时一轮，与上一轮阵容尽量不重样）</div>';
    body = (squads.notice ? '<div class="sq-notice">' + esc(squads.notice) + "</div>" : "") + info +
      squads.rotList.map(rotationCardHTML).join("") +
      '<div class="footnote">阵容由本站模型按数据规则自动生成、每 48 小时轮换一轮（生成器 tools/gen_rotation.mjs，由定时任务调用，不依赖打开网页）：每轮从 18 个战术里选 3 个互不相同的战术，' +
      '各战术多次构建后取综合分最高的一版（质量门槛 ≥58 分，强度优先）；与上一轮每套阵容重合不超过 2 只、本轮 3 套之间也互不重样。战术池含天气队、机制队（印记 / 奉献 / 吸血 / 能量 / 首领）与自由混搭（火草 / 地武 / 消耗控制 / 高速爆发 / 联防反击 / 属性互补）等，' +
      '不再局限于纯属性队。配合链里出现的每个特性 / 技能都出自该精灵的真实数据（特性字段或可学技能池），引文为 desc 原文，可在图鉴里逐条查证。评分与配队页 scoreTeam 同口径。' +
      '注：本作不存在「晴天」天气；「霞光梦境」天气全库没有引用它收益的技能 / 特性，证据不足，未纳入天气战术。</div>';
  }
  app.innerHTML = navHTML("squads") +
    '<header class="top"><h1>🏆 阵容推荐</h1><p>每 48 小时自动轮换的 3 套模型阵容：从 662 只精灵里按战术（天气 / 机制 / 自由混搭）现组现评，强度优先、轮轮不重样。展开详情看成员分工与 🔗 配合链——谁喂谁、谁引爆谁，条条有技能 / 特性原文为据。看中哪套，一键设为我方队伍去打 6v6 分析。</p></header>' +
    body;

  app.querySelectorAll("[data-sq-open]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-sq-open");
      squads.openId = squads.openId === id ? "" : id;
      squads.savedY = window.scrollY;
      squads.keepScroll = true;
      renderSquads();
    });
  });
  function applySquad(id){
    var d = squads.rotList.filter(function(x){ return x.id === id; })[0];
    if (!d) return null;
    team.mine = d.members.map(function(m){ return m.id; });
    saveTeam();
    return d;
  }
  app.querySelectorAll("[data-sq-set]").forEach(function(b){
    b.addEventListener("click", function(){
      var d = applySquad(b.getAttribute("data-sq-set"));
      if (d) {
        squads.notice = "已把「" + d.title + "」设为我方队伍（" + team.mine.length + " 只），去对战页选好敌方就能做 6v6 分析，或在配队页继续微调。";
        squads.openId = d.id;
        renderSquads();
      }
    });
  });
  app.querySelectorAll("[data-sq-battle]").forEach(function(b){
    b.addEventListener("click", function(){
      var d = applySquad(b.getAttribute("data-sq-battle"));
      if (d) { battle.mode = "pvp"; location.hash = "#/battle"; }
    });
  });
  app.querySelectorAll("[data-sq-retry]").forEach(function(b){
    b.addEventListener("click", function(){
      squads.rotState = "idle";
      renderSquads();
    });
  });
  if (squads.keepScroll) { squads.keepScroll = false; window.scrollTo(0, squads.savedY || 0); }
  else window.scrollTo(0, 0);
}

/* ============ 路由与启动 ============ */
function route(){
  var h = location.hash || "#/";
  var m = h.match(/^#\/pet\/(\d+)/);
  if (m) { renderDetail(parseInt(m[1], 10)); return; }
  if (h.indexOf("#/battle") === 0) {
    var bm = h.match(/[?&]atk=(\d+)/);
    if (bm && DB.petById[parseInt(bm[1], 10)]) { battle.atkId = parseInt(bm[1], 10); battle.skillName = null; battle.mode = "calc"; }
    renderBattle(); return;
  }
  if (h.indexOf("#/team") === 0) {
    var am = h.match(/[?&]add=(\d+)/);
    if (am) {
      var addId = parseInt(am[1], 10);
      if (DB.petById[addId] && team.mine.indexOf(addId) < 0 && team.mine.length < 6) {
        team.mine.push(addId); saveTeam();
      }
    }
    renderTeam(); return;
  }
  if (h.indexOf("#/train") === 0) {
    var pm = h.match(/[?&]pet=(\d+)/);
    if (pm && DB.petById[parseInt(pm[1], 10)]) train.petId = parseInt(pm[1], 10);
    renderTrain(); return;
  }
  if (h.indexOf("#/squads") === 0) { renderSquads(); return; }
  renderList();
  if (listScrollY) restoreScroll();
}
window.addEventListener("hashchange", route);
window.addEventListener("scroll", function(){
  var h = location.hash || "#/";
  if (h === "#/" || h === "") listScrollY = window.scrollY;
}, { passive: true });

function loadJson(url, optional){
  return fetch(url).then(function(r){
    if (!r.ok) throw new Error(url + " HTTP " + r.status);
    return r.json();
  }).catch(function(e){
    if (optional) return null;
    throw e;
  });
}
Promise.all([
  loadJson("data/pets.json"),
  loadJson("data/skills.json"),
  loadJson("data/evolutions.json"),
  loadJson("data/images.json", true),
  loadJson("data/typechart.json", true),
  loadJson("data/natures.json", true)
]).then(function(res){
  DB.pets = res[0];
  DB.skills = res[1];
  DB.chains = (res[2] && res[2].chains) ? res[2].chains : res[2];
  DB.images = res[3] || {};
  DB.chart = res[4] || null;
  DB.natures = res[5] || [];
  buildIndex();
  if (team._restore) team._restore();
  route();
}).catch(function(e){
  document.getElementById("app").innerHTML =
    '<div class="errbox">图鉴数据加载失败，请检查网络后刷新重试。<br><small>' + esc(e.message || e) + "</small></div>";
});
</script>
</body>
