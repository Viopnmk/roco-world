<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>洛克王国：世界 · 精灵图鉴</title>
<style>
  :root{
    --bg:#f4f5f9; --card:#ffffff; --ink:#23242b; --sub:#7a7d8c; --line:#e6e7ee;
    --accent:#5b6cff; --accent-soft:#eef0ff; --radius:14px;
    --good:#2f9e5f; --bad:#d35450; --warn:#e08a1e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  /* 顶部不再有导航（已改底部标签栏）：scroll-padding-top 只留小余量；
     底部留白 = 标签栏高（约 57px）+ safe-area + 余量，滚到底最后一卡不被标签栏压。 */
  html{scroll-padding-top:8px; scroll-padding-bottom:calc(96px + env(safe-area-inset-bottom));}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.5;}
  .wrap{max-width:960px; margin:0 auto; padding:0 12px calc(96px + env(safe-area-inset-bottom));}
  a{color:inherit; text-decoration:none;}

  /* ---------- 底部标签栏（原顶部导航） ---------- */
  /* 五大版块固定在屏幕底部：实心底 + 顶边线 + 上向阴影，图标在上、文字在下，5 等分；
     fixed 定位脱离文档流（在 .wrap 内渲染也按视口定位，.wrap 无 transform 不构成包含块）；
     padding-bottom 吃 safe-area，栏体不被 iPhone Home 条压住。当前页：蓝字 + 图标浅蓝胶囊。 */
  .topnav{position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--card); border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(35,36,60,.06);
    display:flex; gap:2px; align-items:stretch;
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));}
  .topnav a{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; padding:3px 0 2px; border-radius:12px; font-size:11px; font-weight:500;
    color:var(--sub); line-height:1.25;}
  .topnav a .nv-ic{font-size:21px; line-height:1.2; padding:1px 14px; border-radius:999px;}
  .topnav a.on{color:var(--accent); font-weight:700;}
  .topnav a.on .nv-ic{background:var(--accent-soft);}

  /* ---------- 列表页 ---------- */
  header.top{padding:12px 2px 10px;}
  header.top h1{font-size:22px; margin:0 0 2px;}
  header.top p{margin:0; color:var(--sub); font-size:13px;}
  .searchbar{position:sticky; top:0; z-index:40; background:var(--bg); padding:6px 0 6px;}
  .searchbar input{width:100%; padding:11px 14px; font-size:16px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); outline:none; color:var(--ink);}
  .searchbar input:focus{border-color:var(--accent);}
  .chips{display:flex; gap:6px; overflow-x:auto; padding:6px 0 2px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer;}
  .chip.on{border-color:transparent; font-weight:600;}
  .filterrow{display:flex; gap:8px; align-items:center; padding:8px 0 2px; flex-wrap:wrap;}
  .filterrow select{flex:1; min-width:120px; padding:8px 10px; font-size:14px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--ink); outline:none;}
  .count{color:var(--sub); font-size:13px; padding:8px 2px;}
  /* minmax(0,1fr)：卡片内 nowrap 长名（.nm）的 min-content 会把 1fr 列下限顶到约 200px、
     撑爆容器并放大整页布局视口，必须允许列收缩到 0 下限。 */
  .grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  @media (min-width:640px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr));} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(6,minmax(0,1fr));} }
  .petcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 8px 9px; text-align:center; display:block;}
  .petcard:active{background:var(--accent-soft);}
  .petcard .ava{width:72px; height:72px; margin:0 auto; border-radius:12px; background:#f0f1f6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .petcard .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .ava .ph{font-size:26px; font-weight:700; color:#b9bcce;}
  .petcard .no{color:var(--sub); font-size:11px; margin-top:6px;}
  .petcard .nm{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .petcard .tot{color:var(--sub); font-size:12px; margin-top:2px;}
  .badges{display:flex; gap:4px; justify-content:center; margin-top:5px; flex-wrap:wrap;}
  .badge{font-size:11px; line-height:1; padding:4px 8px; border-radius:999px; font-weight:600;}
  .empty{padding:48px 0; text-align:center; color:var(--sub);}

  /* ---------- 详情页 ---------- */
  .backbtn{display:inline-block; margin:14px 0 4px; padding:7px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:999px; font-size:14px;}
  .hero{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:10px; text-align:center;}
  .hero .portrait{max-width:320px; margin:0 auto;}
  .hero .portrait img{width:100%; height:auto; display:block;}
  .hero .portrait .ph{font-size:64px; font-weight:700; color:#c6c9da; padding:60px 0;}
  .hero h2{margin:10px 0 2px; font-size:24px;}
  .hero .meta{color:var(--sub); font-size:13px;}
  .hero .badges{margin-top:8px;}
  .hero .badge{font-size:12px; padding:5px 10px;}
  section.blk{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-top:12px;}
  section.blk h3{margin:0 0 10px; font-size:16px;}
  section.blk h4{margin:14px 0 6px; font-size:14px;}
  .stat-row{display:flex; align-items:center; gap:8px; margin:5px 0; font-size:13px;}
  .stat-row .lb{flex:0 0 44px; color:var(--sub);}
  .stat-row .bar{flex:1; height:10px; background:#eef0f5; border-radius:99px; overflow:hidden;}
  .stat-row .fill{height:100%; border-radius:99px; background:var(--accent);}
  .stat-row .vl{flex:0 0 34px; text-align:right; font-weight:600;}
  .stat-row.total .lb,.stat-row.total .vl{color:var(--ink); font-weight:700;}
  .stat-row.total .fill{background:#ff9f43;}
  .kv{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px;}
  .kv div span{color:var(--sub); margin-right:6px;}
  .desc{font-size:14px; color:#3c3e4a;}
  .ability-name{font-weight:700; font-size:15px;}
  .evo-row{display:flex; align-items:flex-start; gap:2px; overflow-x:auto; padding:4px 0; scrollbar-width:none;}
  .evo-row::-webkit-scrollbar{display:none;}
  .evo-item{flex:0 0 auto; width:84px; text-align:center; padding:8px 4px; border-radius:12px; display:block;}
  .evo-item.cur{background:var(--accent-soft); outline:2px solid var(--accent);}
  .evo-item .ava{width:60px; height:60px; margin:0 auto; border-radius:10px; background:#f0f1f6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .evo-item .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .evo-item .nm{font-size:12px; font-weight:600; margin-top:4px; line-height:1.3;}
  .evo-item .cond{font-size:11px; color:var(--sub); line-height:1.35;}
  .evo-arrow{flex:0 0 auto; align-self:center; color:#b9bcce; font-size:16px; padding:0 1px;}
  .evo-label{font-size:13px; color:var(--sub); margin:8px 0 2px;}
  table.sk{width:100%; border-collapse:collapse; font-size:13px;}
  table.sk th{ text-align:left; color:var(--sub); font-weight:500; font-size:12px;
    padding:4px 6px; border-bottom:1px solid var(--line);}
  table.sk td{padding:7px 6px; border-bottom:1px solid #f0f1f6; vertical-align:top;}
  table.sk tr.srow{cursor:pointer;}
  table.sk tr.srow:active{background:var(--accent-soft);}
  table.sk tr.drow td{background:#fafbff; color:#4a4d5e; font-size:12.5px; padding:2px 6px 10px;}
  .sk-type{font-size:11px; padding:3px 7px; border-radius:999px; font-weight:600; white-space:nowrap;}
  .pw{font-weight:600;}
  .blood-group{margin-bottom:10px;}
  .blood-group .gt{font-size:13px; font-weight:700; margin-bottom:4px;}
  .errbox{margin:40px auto; max-width:420px; background:#fff; border:1px solid #f3c2c2; color:#a33;
    border-radius:var(--radius); padding:20px; text-align:center;}
  .loading{padding:60px 0; text-align:center; color:var(--sub);}
  .footnote{color:var(--sub); font-size:12px; line-height:1.6; margin-top:10px;}

  /* ---------- 精灵选择器（对战/配队共用） ---------- */
  .picker input{width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--line);
    border-radius:10px; background:#fff; outline:none; color:var(--ink);}
  .picker input:focus{border-color:var(--accent);}
  .pick-list{max-height:264px; overflow-y:auto; margin-top:6px; border:1px solid var(--line);
    border-radius:10px; background:#fff;}
  .pick-list:empty{display:none;}
  .pick-item{display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px; border:0;
    border-bottom:1px solid #f0f1f6; background:#fff; cursor:pointer; text-align:left; font-size:14px; color:var(--ink);}
  .pick-item:last-child{border-bottom:0;}
  .pick-item:active{background:var(--accent-soft);}
  .pick-item[disabled]{opacity:.45; cursor:default;}
  .pick-item .ava{width:40px; height:40px; flex:0 0 auto; border-radius:9px; background:#f0f1f6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .pick-item .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .pick-item .pi-nm{font-weight:600;}
  .pick-item .pi-sub{color:var(--sub); font-size:12px; margin-left:auto; white-space:nowrap;}
  .pick-item .badges{margin-top:0;}

  /* ---------- 对战页 ---------- */
  .vs-grid{display:grid; grid-template-columns:1fr; gap:0;}
  @media (min-width:760px){ .vs-grid{grid-template-columns:1fr 1fr; gap:12px;} .vs-grid .blk{margin-top:12px;} }
  .mini{display:flex; gap:12px; align-items:flex-start;}
  .mini .ava{width:84px; height:84px; flex:0 0 auto; border-radius:12px; background:#f0f1f6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .mini .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .mini .m-nm{font-size:17px; font-weight:700;}
  .mini .badges{justify-content:flex-start; margin-top:4px;}
  .mini .m-stats{color:var(--sub); font-size:12px; margin-top:4px; line-height:1.5;}
  .skill-list{max-height:300px; overflow-y:auto; border:1px solid var(--line); border-radius:10px;}
  .skill-item{display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border:0;
    border-bottom:1px solid #f0f1f6; background:#fff; cursor:pointer; text-align:left; font-size:14px; color:var(--ink);}
  .skill-item:last-child{border-bottom:0;}
  .skill-item.on{background:var(--accent-soft); outline:2px solid var(--accent); outline-offset:-2px;}
  .skill-item .s-nm{font-weight:600;}
  .skill-item .s-sub{color:var(--sub); font-size:12px; margin-left:auto; white-space:nowrap;}
  .dmg-big{font-size:34px; font-weight:800; text-align:center; margin:2px 0;}
  .dmg-big small{font-size:14px; color:var(--sub); font-weight:500;}
  .hpbar{height:12px; background:#eef0f5; border-radius:99px; overflow:hidden; margin:8px 0 2px;}
  .hpbar .fill{height:100%; background:var(--bad); border-radius:99px;}
  .brk{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .brk span{background:#f4f5fa; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12.5px;}
  .mult-super{color:var(--good); font-weight:700;}
  .mult-resist{color:var(--bad); font-weight:700;}
  .skill-desc{font-size:13px; color:#4a4d5e; background:#fafbff; border:1px solid #eef0ff;
    border-radius:10px; padding:8px 10px; margin-top:10px;}

  /* ---------- 配队页 ---------- */
  .slots{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media (min-width:760px){ .slots{grid-template-columns:repeat(6,1fr);} }
  .slot{background:#fafbfe; border:1.5px dashed #cfd2e0; border-radius:var(--radius);
    min-height:104px; display:flex; align-items:center; justify-content:center; color:#b9bcce;
    font-size:13px; text-align:center; padding:8px 4px;}
  .slot.filled{border-style:solid; border-color:var(--line); background:#fff; color:var(--ink);
    flex-direction:column; position:relative; gap:2px;}
  .slot .ava{width:52px; height:52px; border-radius:10px; background:#f0f1f6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .slot .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .slot .s-nm{font-size:12.5px; font-weight:600; line-height:1.25;}
  .slot .s-rm{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    border:1px solid var(--line); background:#fff; color:var(--sub); font-size:13px; line-height:1;
    cursor:pointer; padding:0;}
  .slot .badges{margin-top:2px;}
  .score-total{text-align:center; padding:6px 0 2px;}
  .score-total .n{font-size:40px; font-weight:800;}
  .score-total .t{color:var(--sub); font-size:13px;}
  .score-row{margin:12px 0;}
  .score-row .sr-head{display:flex; align-items:baseline; gap:8px; font-size:14px;}
  .score-row .sr-head b{font-size:15px;}
  .score-row .sr-val{margin-left:auto; font-weight:700;}
  .score-row .bar{height:9px; background:#eef0f5; border-radius:99px; overflow:hidden; margin:5px 0 4px;}
  .score-row .fill{height:100%; background:var(--accent); border-radius:99px;}
  .score-row .why{color:var(--sub); font-size:12.5px; line-height:1.55;}
  .seg{display:flex; gap:8px; align-items:center; margin-top:4px;}
  .seg button{border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px;
    padding:6px 14px; font-size:13.5px; cursor:pointer;}
  .seg button.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .rec-item{display:flex; gap:10px; align-items:flex-start; padding:10px 2px; border-bottom:1px solid #f0f1f6;}
  .rec-item:last-child{border-bottom:0;}
  .rec-item .ava{width:52px; height:52px; flex:0 0 auto; border-radius:10px; background:#f0f1f6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .rec-item .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .rec-item .r-nm{font-weight:700; font-size:14.5px;}
  .rec-item .r-nm .gain{color:var(--good); font-size:12.5px; margin-left:6px;}
  .rec-item .r-why{color:#4a4d5e; font-size:12.5px; line-height:1.55; margin-top:2px;}
  .cov-line{font-size:13px; line-height:1.9;}

  /* ---------- 对战页签与 6v6 分析 ---------- */
  .btabs{display:flex; gap:8px; margin:2px 0 4px;}
  .btabs button{flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
    border-radius:999px; padding:8px 0; font-size:14.5px; font-weight:600; cursor:pointer;}
  .btabs button.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  .verdict{text-align:center; padding:4px 0 2px;}
  .verdict .v-t{font-size:27px; font-weight:800;}
  .verdict .v-p{color:var(--sub); font-size:13.5px; margin-top:2px;}
  .cmp{margin:13px 0;}
  .cmp-head{display:flex; align-items:baseline; gap:8px; font-size:14px;}
  .cmp-head .cmp-vs{margin-left:auto; font-size:12.5px; color:var(--sub); white-space:nowrap;}
  .cmp-bar{display:flex; height:10px; border-radius:99px; overflow:hidden; margin:5px 0 4px; background:#eef0f5;}
  .cmp-mine{background:var(--accent); height:100%;}
  .cmp-foe{background:#d98a86; height:100%;}
  .cmp .why{color:var(--sub); font-size:12.5px; line-height:1.55;}
  .mx-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%;}
  /* 对位矩阵用 div + flex 行实现，不再用 <table>：iOS Safari 真机对
     table-layout:fixed + sticky th 的组合渲染不可靠（桌面 Chromium/WebKit 均正常、
     真机却首列被撑到约 3/4 屏宽、数据列被裁），故整表脱离 table 布局路径。
     flex 行的列宽由 flex-basis 写死（首列 96 + 数据列 74×6 + 间距 3×6 = 558），与内容无关；
     行首格 sticky left 的包含块是整行（558px），能正常吸左，底色不透明不透字。 */
  .mxg{display:flex; flex-direction:column; gap:3px; width:max-content; margin:0 auto; font-size:12px;}
  .mxg-row{display:flex; gap:3px;}
  .mxg-corner,.mxg-rh{flex:0 0 96px; background:#f4f5fa; border-radius:9px; padding:6px 5px;
    font-weight:600; text-align:left; position:sticky; left:0; z-index:2;
    display:flex; flex-direction:column; justify-content:center;}
  .mxg-h{flex:0 0 74px; background:#f4f5fa; border-radius:9px; padding:6px 5px;
    text-align:center; font-weight:600; display:flex; flex-direction:column; justify-content:center;}
  .mxg-h .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .mxg-c{flex:0 0 74px; border-radius:9px; padding:6px 5px; text-align:center;
    display:flex; flex-direction:column; justify-content:center;}
  .mx-nm{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:78px;}
  .mxg-h .mx-nm{margin:0 auto; max-width:64px;}
  .mxg-rh .mx-sub{display:block; color:var(--sub); font-weight:400; font-size:11px;}
  .mx-c .mx-pct{font-size:15px; font-weight:800; line-height:1.2;}
  .mx-c .mx-hit{font-size:11px; line-height:1.3;}
  .mx-c .mx-sk{font-size:10.5px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px; margin:0 auto;}
  .mx-hi{background:#fbd9d6; color:#9c2b25;}
  .mx-mid{background:#fdf0d2; color:#8a5a00;}
  .mx-lo{background:#eef0f5; color:#6d707e;}
  .mx-legend{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.7;}
  .mx-legend b{padding:1px 7px; border-radius:6px; font-weight:600;}
  .ana p{margin:5px 0 10px; font-size:14px; line-height:1.7; color:#33353f;}
  .ana h4{margin:14px 0 2px; font-size:14.5px;}
  .ana h4:first-child{margin-top:0;}
  .threat-line{font-size:13.5px; line-height:1.6; padding:7px 0; border-bottom:1px solid #f0f1f6;}
  .threat-line:last-child{border-bottom:0;}

  /* ---------- 培养页 ---------- */
  .train-skills{display:grid; grid-template-columns:1fr; gap:10px;}
  @media (min-width:640px){ .train-skills{grid-template-columns:1fr 1fr;} }
  .tskill{background:#fafbfe; border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
  .tskill .ts-head{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .tskill .ts-nm{font-weight:700; font-size:15.5px;}
  .tskill .ts-meta{color:var(--sub); font-size:12.5px; margin-top:3px;}
  .tskill .ts-why{font-size:12.5px; color:#4a4d5e; line-height:1.55; margin-top:5px;}
  .src-tag{font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; background:#eef0ff; color:#4353c9; white-space:nowrap;}
  .src-tag.stone{background:#fdf0d2; color:#8a5a00;}
  .src-tag.blood{background:#fde8e4; color:#a03d2a;}
  .nat-main{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .nat-nm{font-size:19px; font-weight:800;}
  .nat-plus{color:var(--good); font-weight:700;}
  .nat-minus{color:var(--bad); font-weight:700;}
  .train-note{font-size:13px; color:#4a4d5e; line-height:1.6; margin-top:4px;}

  /* ---------- 阵容页 ---------- */
  .sq-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .sq-head h3{margin:0;}
  .sq-tag{font-size:11.5px; padding:3px 9px; border-radius:999px; font-weight:600; background:var(--accent-soft); color:#4353c9; white-space:nowrap;}
  .sq-score{margin-left:auto; font-size:13px; color:var(--sub); white-space:nowrap;}
  .sq-score b{font-size:19px; color:var(--ink);}
  .sq-avas{display:flex; gap:6px; margin:10px 0 8px;}
  .sq-avas a{flex:1 1 0; min-width:0;}
  .sq-avas .ava{width:100%; aspect-ratio:1; border-radius:10px; background:#f0f1f6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .sq-avas .ava img{width:100%; height:100%; object-fit:contain; display:block;}
  .sq-avas .sq-nm{font-size:11px; text-align:center; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sq-blurb{font-size:13.5px; color:#4a4d5e; line-height:1.6;}
  .sq-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .sq-actions button{flex:1 1 130px; border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:8px 10px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .sq-actions button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .sq-detail{margin-top:12px; border-top:1px solid #f0f1f6; padding-top:10px;}
  .sq-link{font-size:13px; line-height:1.6; color:#3c3f52; background:#f6f7ff; border:1px solid #e3e6fb; border-radius:10px; padding:8px 10px; margin-top:6px;}
  .sq-quote{font-size:12px; color:var(--sub); margin-top:2px;}
  .role-tag{font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; background:#fdf0d2; color:#8a5a00; white-space:nowrap;}
  .sq-mem .r-why a{color:var(--accent); font-weight:600;}
  .sq-notice{background:#eafaf0; border:1px solid #bfe8cd; color:#1e6b3c; border-radius:12px;
    padding:10px 12px; font-size:13.5px; margin-top:12px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">正在加载图鉴数据…</div></div>

<script>
"use strict";
/* ============ 基础工具 ============ */
var TYPE_COLORS = {
  "普通":"#A8A77A","火":"#EE8130","水":"#6390F0","草":"#7AC74C","电":"#F7D02C","冰":"#96D9D6",
  "地":"#E2BF65","龙":"#7357FF","毒":"#A33EA1","虫":"#A6B91A","武":"#C22E28","翼":"#A98FF3",
  "萌":"#D685AD","幽灵":"#735797","恶":"#705746","机械":"#B7B7CE","幻":"#F95587","光":"#F2C94C",
  "无":"#C9C9C9"
};
var TYPE_DARK_TEXT = {"电":1,"冰":1,"地":1,"机械":1,"光":1,"无":1};
var TYPES18 = ["普通","火","水","草","电","冰","地","龙","毒","虫","武","翼","萌","幽灵","恶","机械","幻","光"];
var STAT_LABELS = [["hp","体力"],["atk","物攻"],["def","物防"],["spa","魔攻"],["spd","魔防"],["spe","速度"]];
var FILEPATH = "https://wiki.biligame.com/nrc/Special:FilePath/";

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function badge(type){
  var bg = TYPE_COLORS[type] || "#C9C9C9";
  var fg = TYPE_DARK_TEXT[type] ? "#333" : "#fff";
  return '<span class="badge" style="background:' + bg + ";color:" + fg + '">' + esc(type) + "</span>";
}
function imgUrl(fn, thumb){
  var rec = DB.images[fn];
  if (rec) return thumb && rec.thumb ? rec.thumb : rec.url;
  return FILEPATH + encodeURIComponent(fn);
}
/* 图片失败回退：直链 -> FilePath -> 首字占位 */
function imgErr(el){
  var step = el.getAttribute("data-step") || "0";
  if (step === "0") {
    el.setAttribute("data-step", "1");
    el.src = FILEPATH + encodeURIComponent(el.getAttribute("data-fn") || "");
  } else {
    var box = el.parentNode;
    if (box) box.innerHTML = '<div class="ph">' + esc(el.getAttribute("data-init") || "?") + "</div>";
  }
}
function imgTag(fn, name, thumb, lazy){
  var init = (name || "?").charAt(0);
  return '<img src="' + esc(imgUrl(fn, thumb)) + '" alt="' + esc(name) + '"' +
    (lazy ? ' loading="lazy"' : "") +
    ' data-fn="' + esc(fn) + '" data-init="' + esc(init) + '" onerror="imgErr(this)">';
}
function navHTML(active){
  function item(key, href, icon, label){
    return '<a href="' + href + '"' + (active === key ? ' class="on"' : "") +
      '><span class="nv-ic">' + icon + '</span><span class="nv-tx">' + label + "</span></a>";
  }
  return '<nav class="topnav">' + item("list", "#/", "📖", "图鉴") +
    item("battle", "#/battle", "⚔️", "对战") + item("team", "#/team", "🧩", "配队") +
    item("squads", "#/squads", "🏆", "阵容") +
    item("train", "#/train", "🧬", "培养") + "</nav>";
}

/* ============ 数据 ============ */
var DB = { pets: [], skills: [], chains: [], images: {}, chart: null, natures: [],
           petById: {}, skillByName: {}, abilityByName: {}, familyByKey: {}, familyByPet: {},
           maxTotal: 1, minTotal: 0, maxSpe: 1 };

function buildIndex(){
  DB.pets.forEach(function(p){ DB.petById[p.id] = p; });
  DB.skills.forEach(function(s){
    if (s.category === "特性") {
      if (!DB.abilityByName[s.name]) DB.abilityByName[s.name] = s;
    } else if (!DB.skillByName[s.name]) {
      DB.skillByName[s.name] = s;
    }
  });
  /* 特性同名兜底：个别技能名只在特性表里出现时也允许查到 */
  DB.skills.forEach(function(s){ if (!DB.skillByName[s.name]) DB.skillByName[s.name] = s; });

  var totals = DB.pets.map(function(p){ return p.stats.total; });
  DB.maxTotal = Math.max.apply(null, totals);
  DB.minTotal = Math.min.apply(null, totals);
  DB.maxSpe = Math.max.apply(null, DB.pets.map(function(p){ return p.stats.spe; }));

  /* 进化链：同一 evolution key 可能有多条记录（每个首领化分支一条），按 key 合并：
     stages 按 pet_id 去重（优先保留带等级/条件的），lords 按 pet_id 去重合并。 */
  var fam = {};
  DB.chains.forEach(function(ch){
    var f = fam[ch.key];
    if (!f) { f = fam[ch.key] = { key: ch.key, name: ch.name, stages: {}, lords: {} }; }
    (ch.stages || []).forEach(function(s){
      var old = f.stages[s.pet_id];
      if (!old || ((s.level != null || s.condition) && old.level == null && !old.condition)) f.stages[s.pet_id] = s;
    });
    (ch.lords || []).forEach(function(s){ if (!f.lords[s.pet_id]) f.lords[s.pet_id] = s; });
  });
  Object.keys(fam).forEach(function(k){
    var f = fam[k];
    f.stageList = Object.keys(f.stages).map(function(id){ return f.stages[id]; })
      .sort(function(a, b){ return (a.stage - b.stage) || (a.pet_id - b.pet_id); });
    f.lordList = Object.keys(f.lords).map(function(id){ return f.lords[id]; });
    DB.familyByKey[k] = f;
    f.stageList.concat(f.lordList).forEach(function(s){
      if (!DB.familyByPet[s.pet_id]) DB.familyByPet[s.pet_id] = f;
    });
  });
}
function familyOf(pet){
  if (pet.evolution_id && DB.familyByKey[pet.evolution_id]) return DB.familyByKey[pet.evolution_id];
  return DB.familyByPet[pet.id] || null;
}
function skillOf(name){ return DB.skillByName[name] || null; }

/* ============ 属性克制（步进规则） ============ */
/* 单系倍率只有 2 / 1 / 0.5。双系守方按步进合并（与 BWIKI 模块自带双系表
   1836 格全量对齐验证）：每系 +1 步（被克制）/ -1 步（被抵抗），
   合计 +2 -> ×3、+1 -> ×2、0 -> ×1、-1 -> ×0.5、-2 -> ×0.25。本作无 ×0 免疫。 */
var STEP_MULT = { "-2": 0.25, "-1": 0.5, "0": 1, "1": 2, "2": 3 };
function typeMult(atkType, defTypes){
  if (!DB.chart) return 1;
  var row = DB.chart[atkType] || {};
  var step = 0;
  (defTypes || []).forEach(function(d){
    var m = row[d];
    if (m === 2) step += 1;
    else if (m === 0.5) step -= 1;
  });
  return STEP_MULT[step] != null ? STEP_MULT[step] : 1;
}
function multClass(m){ return m > 1 ? "mult-super" : (m < 1 ? "mult-resist" : ""); }
function multLabel(m){
  if (m >= 3) return "双重克制 ×3";
  if (m === 2) return "克制 ×2";
  if (m === 1) return "等倍 ×1";
  if (m === 0.5) return "抵抗 ×0.5";
  return "双重抵抗 ×0.25";
}

/* ============ 精灵技能与选择器 ============ */
function petSkills(pet){
  /* learnset 三组去重合并，保留学习顺序，返回技能对象数组（结果缓存） */
  if (pet._skl) return pet._skl;
  var seen = {}, out = [];
  var ls = pet.learnset || { level: [], stone: [], bloodline: [] };
  var names = [];
  (ls.level || []).forEach(function(x){ names.push(x.skill); });
  (ls.stone || []).forEach(function(n){ names.push(n); });
  (ls.bloodline || []).forEach(function(b){ names.push(b.skill); });
  names.forEach(function(n){
    if (seen[n]) return;
    seen[n] = 1;
    var sk = skillOf(n);
    if (sk) out.push(sk);
  });
  pet._skl = out;
  return out;
}
function petAtkTypes(pet){
  /* 该精灵全部有威力技能的属性集合（配队打击面用，缓存） */
  if (pet._atkTypes) return pet._atkTypes;
  var set = {};
  petSkills(pet).forEach(function(sk){
    if (sk.power != null && sk.category !== "特性" && sk.type && sk.type !== "无") set[sk.type] = 1;
  });
  pet._atkTypes = Object.keys(set);
  return pet._atkTypes;
}
function searchPets(q, limit){
  q = (q || "").trim().toLowerCase();
  if (!q) return [];
  var out = [];
  for (var i = 0; i < DB.pets.length && out.length < limit; i++) {
    var p = DB.pets[i];
    if ((p.name && p.name.toLowerCase().indexOf(q) >= 0) ||
        (p.species && p.species.toLowerCase().indexOf(q) >= 0) ||
        (p.pinyin && p.pinyin.toLowerCase().indexOf(q) >= 0) ||
        (p.no && p.no.indexOf(q) >= 0) || String(p.id) === q) out.push(p);
  }
  return out;
}
function pickerHTML(prefix, placeholder){
  return '<div class="picker"><input id="' + prefix + '-q" type="search" placeholder="' +
    esc(placeholder) + '" autocomplete="off">' +
    '<div class="pick-list" id="' + prefix + '-res"></div></div>';
}
/* 绑定选择器：onPick(pet) 在点选时回调；isDisabled(pet) 返回字符串则该行禁用并显示原因 */
function bindPicker(prefix, onPick, isDisabled){
  var input = document.getElementById(prefix + "-q");
  var box = document.getElementById(prefix + "-res");
  if (!input || !box) return;
  function draw(){
    var list = searchPets(input.value, 24);
    box.innerHTML = list.map(function(p){
      var dis = isDisabled ? isDisabled(p) : "";
      return '<button class="pick-item" data-id="' + p.id + '"' + (dis ? " disabled" : "") + ">" +
        '<span class="ava">' + imgTag(p.avatar, p.name, true, true) + "</span>" +
        '<span class="pi-nm">' + esc(p.name) + "</span>" +
        '<span class="badges">' + p.types.map(badge).join("") + "</span>" +
        '<span class="pi-sub">' + (dis ? esc(dis) : "No." + esc(p.no) + " · 总和 " + p.stats.total) + "</span></button>";
    }).join("");
  }
  input.addEventListener("input", draw);
  box.addEventListener("click", function(e){
    var b = e.target.closest("[data-id]");
    if (!b || b.disabled) return;
    var pet = DB.petById[parseInt(b.getAttribute("data-id"), 10)];
    if (pet) onPick(pet);
  });
}
function miniCard(pet){
  var st = pet.stats;
  return '<div class="mini"><div class="ava">' + imgTag(pet.avatar, pet.name, true, false) + "</div>" +
    '<div><div class="m-nm">' + esc(pet.name) + ' <small style="color:var(--sub);font-size:12px">No.' + esc(pet.no) + "</small></div>" +
    '<div class="badges">' + pet.types.map(badge).join("") + "</div>" +
    '<div class="m-stats">体力 ' + st.hp + " · 物攻 " + st.atk + " · 物防 " + st.def +
    "<br>魔攻 " + st.spa + " · 魔防 " + st.spd + " · 速度 " + st.spe + " · 总和 " + st.total + "</div></div></div>";
}

/* ============ 列表页 ============ */
var ui = { q: "", type: "", season: "all", sort: "no" };

function filteredPets(){
  var q = ui.q.trim().toLowerCase();
  var list = DB.pets.filter(function(p){
    if (ui.type && p.types.indexOf(ui.type) < 0) return false;
    if (ui.season === "none" && p.season) return false;
    if (ui.season !== "all" && ui.season !== "none" && p.season !== ui.season) return false;
    if (q) {
      var hit = (p.name && p.name.toLowerCase().indexOf(q) >= 0) ||
                (p.species && p.species.toLowerCase().indexOf(q) >= 0) ||
                (p.pinyin && p.pinyin.toLowerCase().indexOf(q) >= 0) ||
                (p.no && p.no.indexOf(q) >= 0) ||
                String(p.id) === q;
      if (!hit) return false;
    }
    return true;
  });
  var s = ui.sort;
  if (s === "no") list.sort(function(a, b){ return a.id - b.id; });
  else if (s === "total-desc") list.sort(function(a, b){ return b.stats.total - a.stats.total; });
  else if (s === "total-asc") list.sort(function(a, b){ return a.stats.total - b.stats.total; });
  else list.sort(function(a, b){ return (b.stats[s] || 0) - (a.stats[s] || 0); });
  return list;
}

function renderList(){
  var app = document.getElementById("app");
  var chips = TYPES18.map(function(t){
    var on = ui.type === t;
    var style = on ? ' style="background:' + TYPE_COLORS[t] + ";color:" + (TYPE_DARK_TEXT[t] ? "#333" : "#fff") + '"' : "";
    return '<button class="chip' + (on ? " on" : "") + '"' + style + ' data-type="' + esc(t) + '">' + esc(t) + "</button>";
  }).join("");
  var seasonOpts = [["all","全部赛季"],["none","无赛季"],["S1","S1"],["S2","S2"],["S3","S3"],["S4","S4"],["S5","S5"]]
    .map(function(o){ return '<option value="' + o[0] + '"' + (ui.season === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("");
  var sortOpts = [["no","图鉴编号"],["total-desc","总和 ↓"],["total-asc","总和 ↑"],
                  ["hp","体力 ↓"],["atk","物攻 ↓"],["def","物防 ↓"],["spa","魔攻 ↓"],["spd","魔防 ↓"],["spe","速度 ↓"]]
    .map(function(o){ return '<option value="' + o[0] + '"' + (ui.sort === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("");

  app.innerHTML = navHTML("list") +
    '<header class="top"><h1>🐾 精灵图鉴</h1><p>《洛克王国：世界》 · 共 ' + DB.pets.length + ' 只精灵</p></header>' +
    '<div class="searchbar"><input id="q" type="search" placeholder="搜索名字 / 物种 / 拼音 / 编号…" value="' + esc(ui.q) + '"></div>' +
    '<div class="chips" id="chips">' + chips + "</div>" +
    '<div class="filterrow"><select id="seasonSel">' + seasonOpts + '</select><select id="sortSel">' + sortOpts + "</select></div>" +
    '<div class="count" id="count"></div><div class="grid" id="grid"></div><div id="noresult"></div>';

  document.getElementById("q").addEventListener("input", function(e){ ui.q = e.target.value; renderGrid(); });
  document.getElementById("chips").addEventListener("click", function(e){
    var b = e.target.closest("[data-type]"); if (!b) return;
    var t = b.getAttribute("data-type");
    ui.type = (ui.type === t) ? "" : t;
    renderList(); restoreScroll();
  });
  document.getElementById("seasonSel").addEventListener("change", function(e){ ui.season = e.target.value; renderGrid(); });
  document.getElementById("sortSel").addEventListener("change", function(e){ ui.sort = e.target.value; renderGrid(); });
  renderGrid();
}
var listScrollY = 0;
function restoreScroll(){ window.scrollTo(0, listScrollY); }

function renderGrid(){
  var list = filteredPets();
  document.getElementById("count").textContent = "共 " + list.length + " 只";
  var grid = document.getElementById("grid");
  var frag = document.createDocumentFragment();
  var tmp = document.createElement("div");
  list.forEach(function(p){
    tmp.innerHTML = '<a class="petcard" href="#/pet/' + p.id + '">' +
      '<div class="ava">' + imgTag(p.avatar, p.name, true, true) + "</div>" +
      '<div class="no">No.' + esc(p.no) + "</div>" +
      '<div class="nm">' + esc(p.name) + "</div>" +
      '<div class="badges">' + p.types.map(badge).join("") + "</div>" +
      '<div class="tot">总和 ' + p.stats.total + "</div></a>";
    frag.appendChild(tmp.firstChild);
  });
  grid.innerHTML = "";
  grid.appendChild(frag);
  document.getElementById("noresult").innerHTML =
    list.length ? "" : '<div class="empty">没有符合条件的精灵，换个筛选试试。</div>';
}

/* ============ 详情页 ============ */
function evoItem(s, curId){
  var pet = DB.petById[s.pet_id];
  var name = pet ? pet.name : s.name;
  var ava = pet ? pet.avatar : "";
  var cond = "";
  if (s.level != null) cond = "Lv." + s.level + " 进化";
  if (s.condition) cond = (cond ? cond + " · " : "") + s.condition;
  if (s.item) cond = (cond ? cond + " · " : "") + "信物：" + s.item;
  return '<a class="evo-item' + (s.pet_id === curId ? " cur" : "") + '" href="#/pet/' + s.pet_id + '">' +
    '<div class="ava">' + (ava ? imgTag(ava, name, true, true) : '<div class="ph">' + esc(name.charAt(0)) + "</div>") + "</div>" +
    '<div class="nm">' + esc(name) + "</div>" +
    (cond ? '<div class="cond">' + esc(cond) + "</div>" : "") + "</a>";
}
function skillRows(items){
  /* items: [{lv?, name}] -> 可展开行（点一行展开/收起描述） */
  var html = "";
  items.forEach(function(it, i){
    var sk = skillOf(it.name);
    var type = sk ? sk.type : "—";
    var cat = sk ? sk.category : "—";
    var pw = sk && sk.power != null ? sk.power : "—";
    var en = sk && sk.energy != null ? sk.energy : "—";
    html += '<tr class="srow" data-i="' + i + '">' +
      (it.lv != null ? "<td>" + it.lv + "</td>" : "") +
      "<td><b>" + esc(it.name) + "</b></td>" +
      "<td>" + (TYPE_COLORS[type] ? badge(type) : esc(type)) + "</td>" +
      "<td>" + esc(cat) + "</td>" +
      '<td class="pw">' + pw + "</td><td>" + en + "</td></tr>" +
      '<tr class="drow" data-d="' + i + '" style="display:none"><td colspan="' + (it.lv != null ? 6 : 5) + '">' +
      esc(sk ? (sk.desc || "（暂无描述）") : "（技能数据缺失）") + "</td></tr>";
  });
  return html;
}
function bindSkillTable(tbl){
  if (!tbl) return;
  tbl.addEventListener("click", function(e){
    var tr = e.target.closest("tr.srow"); if (!tr) return;
    var d = tbl.querySelector('tr[data-d="' + tr.getAttribute("data-i") + '"]');
    if (d) d.style.display = d.style.display === "none" ? "" : "none";
  });
}

function renderDetail(id){
  var pet = DB.petById[id];
  var app = document.getElementById("app");
  if (!pet) {
    app.innerHTML = navHTML("list") + '<a class="backbtn" href="#/">← 返回图鉴</a><div class="errbox">没有找到这只精灵。</div>';
    return;
  }
  var ab = DB.abilityByName[pet.ability];
  var fam = familyOf(pet);
  var statHtml = STAT_LABELS.map(function(sl){
    var v = pet.stats[sl[0]] || 0;
    var w = Math.min(v / 200 * 100, 100);
    return '<div class="stat-row"><span class="lb">' + sl[1] + '</span><div class="bar"><div class="fill" style="width:' + w + '%"></div></div><span class="vl">' + v + "</span></div>";
  }).join("") +
    '<div class="stat-row total"><span class="lb">总和</span><div class="bar"><div class="fill" style="width:' +
    Math.min(pet.stats.total / 800 * 100, 100) + '%"></div></div><span class="vl">' + pet.stats.total + "</span></div>";

  var evoHtml = "";
  if (fam) {
    var row = fam.stageList.map(function(s){ return evoItem(s, pet.id); }).join('<div class="evo-arrow">→</div>');
    evoHtml = '<div class="evo-row">' + row + "</div>";
    if (fam.lordList.length) {
      evoHtml += '<div class="evo-label">首领化分支</div><div class="evo-row">' +
        fam.lordList.map(function(s){ return evoItem(s, pet.id); }).join("") + "</div>";
    }
  } else {
    evoHtml = '<div class="desc">暂无进化链数据。</div>';
  }

  var ls = pet.learnset || { level: [], stone: [], bloodline: [] };
  var levelItems = (ls.level || []).map(function(x){ return { lv: x.lv, name: x.skill }; });
  var stoneItems = (ls.stone || []).map(function(n){ return { name: n }; });
  var bloodGroups = {};
  (ls.bloodline || []).forEach(function(b){
    (bloodGroups[b.type] = bloodGroups[b.type] || []).push({ name: b.skill });
  });
  var bloodHtml = Object.keys(bloodGroups).map(function(t){
    return '<div class="blood-group"><div class="gt">' + badge(t) + ' 血脉</div>' +
      '<table class="sk"><tbody>' +
      bloodGroups[t].map(function(it){
        var sk = skillOf(it.name);
        return "<tr><td><b>" + esc(it.name) + "</b></td><td>" + esc(sk ? sk.category : "—") +

/* ============ 对战模拟 ============ */
/* 伤害口径（估算）：伤害 = 威力 × (攻击种族值 / 防御种族值) × 克制倍率 × 本系加成
   物理用 物攻/物防，魔法用 魔攻/魔防；本系加成 = 技能属性与攻方属性一致时 ×1.2。
   克制倍率查 typechart.json（BWIKI 克制计算器同源数据），双系按步进规则合并。
   BWIKI 未公开本作完整伤害公式，此处为按种族值口径的估算，不含等级/个体差异。 */
var battle = { atkId: null, defId: null, skillName: null, mode: "pvp" };

function calcDamage(atkPet, skill, defPet){
  if (!skill || skill.category === "变化" || skill.power == null) return null;
  var phys = skill.category === "物理";
  var A = phys ? atkPet.stats.atk : atkPet.stats.spa;
  var D = phys ? defPet.stats.def : defPet.stats.spd;
  var mult = typeMult(skill.type, defPet.types);
  var stab = atkPet.types.indexOf(skill.type) >= 0 ? 1.2 : 1;
  var dmg = skill.power * (A / D) * mult * stab;
  return { dmg: dmg, mult: mult, stab: stab, A: A, D: D, phys: phys,
           pct: dmg / defPet.stats.hp * 100,
           eff: skill.energy > 0 ? dmg / skill.energy : null };
}

function renderBattleCalc(){

      battle.skillName = dmgSkills.length ? dmgSkills.reduce(function(a, b){ return b.power > a.power ? b : a; }).name : (skills[0] ? skills[0].name : null);
    }
    skillHtml = '<div class="skill-list">' + skills.map(function(sk){

      return '<button class="skill-item' + (sk.name === battle.skillName ? " on" : "") + '" data-skill="' + esc(sk.name) + '">' +

    } else {
      var hits = r.pct >= 100 ? "约 1 击" : "约 " + Math.ceil(100 / r.pct) + " 击";
      resultHtml = '<section class="blk"><h3>计算结果</h3>' +
        '<div class="dmg-big">' + r.dmg.toFixed(1) + ' <small>点伤害（对 ' + esc(def.name) + "）</small></div>" +
        '<div class="hpbar"><div class="fill" style="width:' + Math.min(r.pct, 100) + '%"></div></div>' +
        '<div class="desc">约占 ' + esc(def.name) + " 体力种族值（" + def.stats.hp + "）的 <b>" + r.pct.toFixed(1) + "%</b>，" + hits + " 可以击破（按种族值估算）。</div>" +
        '<div class="brk">' +
        "<span>技能威力 " + skill.power + "</span>" +
        "<span>" + (r.phys ? "物攻 " + r.A + " / 物防 " + r.D : "魔攻 " + r.A + " / 魔防 " + r.D) + " = ×" + (r.A / r.D).toFixed(2) + "</span>" +
        '<span>克制 <b class="' + multClass(r.mult) + '">' + multLabel(r.mult) + "</b></span>" +
        "<span>本系加成 " + (r.stab > 1 ? "×1.2（技能与攻方同属性）" : "×1（非本系）") + "</span>" +
        "<span>能耗 " + skill.energy + (r.eff != null ? " · 每点能耗伤害 " + r.eff.toFixed(1) : " · 零能耗") + "</span>" +

  app.innerHTML = navHTML("battle") +

    battleTabsHTML("calc") +

    '<section class="blk"><h3>攻方精灵</h3>' + pickerHTML("bkAtk", "搜索攻方：名字 / 拼音 / 编号…") +
      '<div style="margin-top:10px">' + (atk ? miniCard(atk) : '<div class="desc" style="color:var(--sub)">未选择</div>') + "</div>" +
      '<h4>攻方技能</h4>' + skillHtml + "</section>" +
    '<section class="blk"><h3>守方精灵</h3>' + pickerHTML("bkDef", "搜索守方：名字 / 拼音 / 编号…") +
      '<div style="margin-top:10px">' + (def ? miniCard(def) : '<div class="desc" style="color:var(--sub)">未选择</div>') + "</div></section>" +
    "</div>" + resultHtml +
    '<div class="footnote">伤害公式（估算口径）：伤害 = 威力 ×（攻击种族值 ÷ 防御种族值）× 克制倍率 × 本系加成（同属性 ×1.2）。' +
    '物理技能用物攻/物防，魔法技能用魔攻/魔防。克制倍率来自 BWIKI 克制计算器同源数据（data/typechart.json）：单系 ×2 / ×0.5，双系按步进合并（双重克制 ×3、双重抵抗 ×0.25），本作没有属性免疫（无 ×0）。' +
    'BWIKI 未公开本作完整伤害公式，这里只按种族值估算，不含等级、个体值与特性增减，仅供配招参考。</div>';

  bindPicker("bkAtk", function(pet){

  });
  var list = app.querySelector(".skill-list");
  if (list) list.addEventListener("click", function(e){

    battle.skillName = b.getAttribute("data-skill");

/* ============ 对战页签与 6v6 PVP 分析 ============ */
/* 出招口径：每只精灵对每个目标，从其全部可学技能（learnset 三组去重）里按
   calcDamage 同一公式逐招计算，取伤害最高的一招为「代表招」；变化类等无威力
   技能不参与。胜负预测由击杀覆盖 / 速度控制 / 种族值总和 / 属性压制四项
   加权合成（35% / 20% / 20% / 25%），全部数字来自真实计算，不做随机模拟。 */
function battleTabsHTML(active){
  return '<div class="btabs">' +
    '<button data-btab="pvp"' + (active === "pvp" ? ' class="on"' : "") + '>🛡️ 6v6 分析</button>' +
    '<button data-btab="calc"' + (active === "calc" ? ' class="on"' : "") + '>🎯 1v1 计算</button></div>';
}
function bindBattleTabs(){
  document.querySelectorAll("[data-btab]").forEach(function(b){
    b.addEventListener("click", function(){
      var m = b.getAttribute("data-btab");
      if (battle.mode !== m) { battle.mode = m; renderBattle(); }
    });
  });
}
function renderBattle(){
  if (battle.mode === "calc") renderBattleCalc();
  else renderBattlePvp();
}

var pvpCache = {};
function bestHit(atkPet, defPet){
  /* 攻方对守方的代表招：全部可学技能里伤害最高的一招，无可用招返回 null */
  var key = atkPet.id + ":" + defPet.id;
  if (pvpCache[key] !== undefined) return pvpCache[key];
  var best = null;
  petSkills(atkPet).forEach(function(sk){
    var r = calcDamage(atkPet, sk, defPet);
    if (!r) return;
    if (!best || r.dmg > best.r.dmg) best = { skill: sk, r: r };
  });
  pvpCache[key] = best;
  return best;
}
function hitsLabel(pct){
  if (pct >= 100) return "1 击";
  if (pct >= 50) return "2 击";
  return "3 击+";
}
function threatOf(pcts){
  /* 一只精灵打对方全队的威胁汇总：pcts 为它对每只目标的最佳伤害% 数组 */
  var t = { maxPct: 0, maxIdx: -1, ko12: 0, ko1: 0, sumCap: 0, sumRaw: 0 };
  pcts.forEach(function(p, i){
    t.sumCap += Math.min(p, 100);
    t.sumRaw += p;
    if (p > t.maxPct) { t.maxPct = p; t.maxIdx = i; }
    if (p >= 50) t.ko12++;
    if (p >= 100) t.ko1++;
  });
  return t;
}
function share2(a, b){ /* a、b 双方数值 -> 我方份额 0-100 */
  return (a + b) > 0 ? Math.round(a / (a + b) * 100) : 50;
}

function analyzePvp(mine, foe){
  var hitM = mine.map(function(a){ return foe.map(function(d){ return bestHit(a, d); }); });
  var hitR = foe.map(function(a){ return mine.map(function(d){ return bestHit(a, d); }); });
  var pctM = hitM.map(function(row){ return row.map(function(h){ return h ? h.r.pct : 0; }); });
  var pctR = hitR.map(function(row){ return row.map(function(h){ return h ? h.r.pct : 0; }); });
  var myThreat = pctM.map(threatOf);
  var foeThreat = pctR.map(threatOf);

  /* 击杀覆盖：对方有几只会被我方至少一人 2 击内带走（≥50%），反之亦然 */
  var koCoverMine = 0, koCoverFoe = 0, oneHitMine = 0, oneHitFoe = 0;
  foe.forEach(function(_, j){
    var best = 0;
    mine.forEach(function(_, i){ if (pctM[i][j] > best) best = pctM[i][j]; });
    if (best >= 50) koCoverMine++;
    if (best >= 100) oneHitMine++;
  });
  mine.forEach(function(_, i){
    var best = 0;
    foe.forEach(function(_, j){ if (pctR[j][i] > best) best = pctR[j][i]; });
    if (best >= 50) koCoverFoe++;
    if (best >= 100) oneHitFoe++;
  });
  var killShare = Math.round(50 + ((koCoverMine / foe.length) - (koCoverFoe / mine.length)) * 50);

  /* 速度控制：均速份额 + 速度线逐位先手（双方速度从高到低对位比较） */
  var avgSpeM = mine.reduce(function(s, p){ return s + p.stats.spe; }, 0) / mine.length;
  var avgSpeF = foe.reduce(function(s, p){ return s + p.stats.spe; }, 0) / foe.length;
  var speM = mine.map(function(p){ return p.stats.spe; }).sort(function(a, b){ return b - a; });
  var speF = foe.map(function(p){ return p.stats.spe; }).sort(function(a, b){ return b - a; });
  var speWin = 0, speLose = 0;
  for (var k = 0; k < Math.min(speM.length, speF.length); k++) {
    if (speM[k] > speF[k]) speWin++;
    else if (speM[k] < speF[k]) speLose++;
  }
  var speedShare = share2(avgSpeM, avgSpeF);

  /* 种族值：平均总和份额 */
  var avgTotM = mine.reduce(function(s, p){ return s + p.stats.total; }, 0) / mine.length;
  var avgTotF = foe.reduce(function(s, p){ return s + p.stats.total; }, 0) / foe.length;
  var sumTotM = mine.reduce(function(s, p){ return s + p.stats.total; }, 0);
  var sumTotF = foe.reduce(function(s, p){ return s + p.stats.total; }, 0);
  var statsShare = share2(avgTotM, avgTotF);

  /* 属性压制：与配队页「对敌压制」同一口径（全队技能属性对每只对手的最高倍率均值） */
  var myTypes = teamAtkTypes(mine), foeTypes = teamAtkTypes(foe);
  var myPress = foe.reduce(function(s, p){ return s + bestMult(myTypes, p.types); }, 0) / foe.length;
  var foePress = mine.reduce(function(s, p){ return s + bestMult(foeTypes, p.types); }, 0) / mine.length;
  var pressShare = share2(myPress, foePress);

  var tendency = Math.round(killShare * 0.35 + speedShare * 0.20 + statsShare * 0.20 + pressShare * 0.25);
  var verdict = tendency >= 58 ? "我方优势" : (tendency <= 42 ? "敌方优势" : "均势");

  /* 王牌 / 最大威胁：先比能 1–2 击带走的只数，再比总威胁（各目标伤害%封顶 100 求和） */
  function pickAce(threats){
    var bi = 0;
    threats.forEach(function(t, i){
      var b = threats[bi];
      if (t.ko12 > b.ko12 || (t.ko12 === b.ko12 && t.sumCap > b.sumCap) ||
          (t.ko12 === b.ko12 && t.sumCap === b.sumCap && t.sumRaw > b.sumRaw)) bi = i;
    });
    return bi;
  }
  var aceIdx = pickAce(myThreat);
  var threatIdx = pickAce(foeThreat);

  /* 应对建议：对每只高威胁敌方（能 1–2 击带走我方至少 1 只，或最高一击 ≥80%），
     选我方最佳应对者：优先能反手 2 击内带走它的，其次看互打的伤害差。 */
  var counters = [];
  foe.forEach(function(f, j){
    var th = foeThreat[j];
    if (!(th.ko12 >= 1 || th.maxPct >= 80)) return;
    var bi = -1, bs = -1e9;
    mine.forEach(function(_, i){
      var score = (pctM[i][j] >= 50 ? 1000 : 0) + pctM[i][j] - pctR[j][i];
      if (score > bs) { bs = score; bi = i; }
    });
    counters.push({ foeIdx: j, mineIdx: bi, myPct: pctM[bi][j], itsPct: pctR[j][bi],
                    mySkill: hitM[bi][j] ? hitM[bi][j].skill.name : null,
                    itsSkill: hitR[j][bi] ? hitR[j][bi].skill.name : null, th: th });
  });

  /* 首发建议：速度与覆盖综合（能 1–2 击威胁的只数 ×25 + 速度种族值） */
  var leadIdx = 0, leadScore = -1;
  mine.forEach(function(p, i){
    var s = myThreat[i].ko12 * 25 + p.stats.spe;
    if (s > leadScore) { leadScore = s; leadIdx = i; }
  });

  return { hitM: hitM, hitR: hitR, pctM: pctM, pctR: pctR, myThreat: myThreat, foeThreat: foeThreat,
    koCoverMine: koCoverMine, koCoverFoe: koCoverFoe, oneHitMine: oneHitMine, oneHitFoe: oneHitFoe,
    killShare: killShare, avgSpeM: avgSpeM, avgSpeF: avgSpeF, speWin: speWin, speLose: speLose, speedShare: speedShare,
    avgTotM: avgTotM, avgTotF: avgTotF, sumTotM: sumTotM, sumTotF: sumTotF, statsShare: statsShare,
    myPress: myPress, foePress: foePress, pressShare: pressShare,
    tendency: tendency, verdict: verdict, aceIdx: aceIdx, threatIdx: threatIdx,
    counters: counters, leadIdx: leadIdx };
}

function pvpCmpRow(label, mineTxt, foeTxt, share, why){
  return '<div class="cmp"><div class="cmp-head"><b>' + label + '</b><span class="cmp-vs">我 ' +
    esc(mineTxt) + " · 敌 " + esc(foeTxt) + '</span></div>' +
    '<div class="cmp-bar"><div class="cmp-mine" style="width:' + share + '%"></div>' +
    '<div class="cmp-foe" style="width:' + (100 - share) + '%"></div></div>' +
    '<div class="why">' + esc(why) + "</div></div>";
}

function pvpAnalysisHTML(mine, foe){
  var A = analyzePvp(mine, foe);
  var vColor = A.verdict === "我方优势" ? "var(--good)" : (A.verdict === "敌方优势" ? "var(--bad)" : "var(--warn)");

  var leadItems = [];
  if (A.killShare >= 55) leadItems.push("击杀覆盖");
  if (A.pressShare >= 55) leadItems.push("属性压制");
  if (A.speedShare >= 55) leadItems.push("速度控制");
  if (A.statsShare >= 55) leadItems.push("种族值");
  var lagItems = [];
  if (A.killShare <= 45) lagItems.push("击杀覆盖");
  if (A.pressShare <= 45) lagItems.push("属性压制");
  if (A.speedShare <= 45) lagItems.push("速度控制");
  if (A.statsShare <= 45) lagItems.push("种族值");
  var overall = "按四项加权，我方倾向 " + A.tendency + "%，" +
    (A.verdict === "均势" ? "双方在伯仲之间，这场主要看临场换宠与先手处理" :
     A.verdict === "我方优势" ? "整体是我方占优的对局" : "整体是敌方占优的对局") + "。" +
    (leadItems.length ? "我方赢在：" + leadItems.join("、") + "。" : "") +
    (lagItems.length ? "短板在：" + lagItems.join("、") + "，开局要避开正面消耗。" : "");

  var html = '<section class="blk"><h3>胜负预测</h3>' +
    '<div class="verdict"><div class="v-t" style="color:' + vColor + '">' + A.verdict + '</div>' +

  /* 对位矩阵（div + flex 行实现，不用 <table>：iOS Safari 真机的 table 布局路径不可靠，见 CSS 处注释） */

  var rows = mine.map(function(m, i){

      return '<div class="mxg-c mx-c ' + cls + '" title="' + esc(h.skill.name) + "（" + esc(h.skill.type) + "·" + esc(h.skill.category) + '）">' +

  /* 反向小结：敌方每只对我方的最大威胁 */

    "。它上场时优先用下面的应对者对位，别让它舒服地连续出手。";

  var counterHtml = "";
  if (A.counters.length) {

        esc(mine[c.mineIdx].name) + "</b> 对位——它用「" + esc(c.mySkill || "代表招") + "」反手能打 " +

    }).join("");

  }

  var lead = mine[A.leadIdx], leadTh = A.myThreat[A.leadIdx];
  var leadRank = mine.slice().sort(function(a, b){ return b.stats.spe - a.stats.spe; }).indexOf(lead) + 1;

    "。先手压一轮血线，能逼对方先交轮换，把节奏握在自己手里。";

  html += '<section class="blk ana"><h3>📝 分析师点评</h3>' +
    "<h4>总体判断</h4><p>" + esc(overall) + "</p>" +
    "<h4>🌟 我方王牌</h4><p>" + esc(aceText) + "</p>" +
    "<h4>⚠️ 最大威胁</h4><p>" + esc(threatText) + "</p>" +
    "<h4>🎯 应对建议</h4>" + counterHtml +

/* ============ 配队评分 ============ */
function teamAtkTypes(pets){
  var set = {};
  pets.forEach(function(p){ petAtkTypes(p).forEach(function(t){ set[t] = 1; }); });
  return Object.keys(set);
}
function bestMult(atkTypes, defTypes){
  var best = 0;
  atkTypes.forEach(function(t){
    var m = typeMult(t, defTypes);
    if (m > best) best = m;
  });
  return best;
}
function scoreTeam(mine, foe){
  /* mine/foe: 精灵对象数组。返回 {total, parts:[{key,label,score,why}], detail:{...}} */
  var empty = { total: 0, parts: [], detail: {} };
  if (!mine.length) return empty;
  var atkTypes = teamAtkTypes(mine);

  /* 打击面覆盖：对 18 种单系守方能打出的最高倍率 */
  var cover = {}, superList = [], gapList = [];
  TYPES18.forEach(function(d){
    var m = bestMult(atkTypes, [d]);
    cover[d] = m;
    if (m >= 2) superList.push(d);
    if (m < 1) gapList.push(d);
  });
  var neutralCount = TYPES18.filter(function(d){ return cover[d] === 1; }).length;
  /* 计分：克制一种记满分、等倍一种记三成、被抵抗记 0 —— 全克制 100、全等倍 30、全被抵抗 0 */
  var offense = Math.round((superList.length * 100 + neutralCount * 30) / 18);
  var offenseWhy = "全队技能一共能打出 " + atkTypes.length + " 种属性的打击面，其中对 " +
    superList.length + " 种属性能克制（×2 起）" +
    (superList.length ? "：" + superList.join("、") : "") + "。" +
    (gapList.length ? "短板：对 " + gapList.join("、") + " 只能打出半伤（×0.5），遇到这类对手会很吃力。" : "没有任何属性被全队抵抗，打击面很完整。");

  /* 防御抗性：弱点重叠 + 人均弱点数 */
  var weakByAtk = {}, totalWeak = 0, resistKinds = 0;
  TYPES18.forEach(function(a){
    var c = 0;
    mine.forEach(function(p){ if (typeMult(a, p.types) > 1) c++; });
    weakByAtk[a] = c;
    totalWeak += c;
    if (c === 0) resistKinds++;
  });
  var maxOverlap = Math.max.apply(null, TYPES18.map(function(a){ return weakByAtk[a]; }));
  var overlapTypes = TYPES18.filter(function(a){ return weakByAtk[a] === maxOverlap && maxOverlap > 0; });
  var avgWeak = totalWeak / mine.length;
  var defense = Math.round((1 - maxOverlap / mine.length) * 60 + Math.max(0, 40 - avgWeak * 10));
  var defenseWhy = "最怕的属性是 " + (maxOverlap ? overlapTypes.join("、") + "，全队有 " + maxOverlap + " 只被它克制" : "无") +
    "；平均每只精灵有 " + avgWeak.toFixed(1) + " 个弱点属性。" +
    (maxOverlap >= Math.ceil(mine.length / 2) && mine.length > 1
      ? "弱点太集中：一发打中弱点的群攻技能就可能同时重创多只，尽量别让半队怕同一种属性。"
      : "弱点分布还算分散，不容易被一种属性一锅端。");

  /* 种族值与速度（按全图鉴极值归一） */
  var avgTotal = mine.reduce(function(s, p){ return s + p.stats.total; }, 0) / mine.length;
  var statsScore = Math.round((avgTotal - DB.minTotal) / (DB.maxTotal - DB.minTotal) * 100);
  var statsWhy = "全队平均种族值总和 " + Math.round(avgTotal) + "（全图鉴范围 " + DB.minTotal + "～" + DB.maxTotal +
    "）。这是面板下限参考：进化到最终形态、总和高的精灵通常更耐打也更能打。";
  var avgSpe = mine.reduce(function(s, p){ return s + p.stats.spe; }, 0) / mine.length;
  var topSpe = Math.max.apply(null, mine.map(function(p){ return p.stats.spe; }));
  var speedScore = Math.round((avgSpe / DB.maxSpe) * 70 + (topSpe / DB.maxSpe) * 30);
  var speedWhy = "全队平均速度 " + Math.round(avgSpe) + "，最快 " + topSpe + "（全图鉴最快 " + DB.maxSpe +
    "）。速度决定出手顺序：队伍整体太慢，容易在出手前先挨打。";

  var parts = [
    { key: "offense", label: "🎯 打击面覆盖", score: offense, why: offenseWhy },
    { key: "defense", label: "🛡️ 防御抗性", score: defense, why: defenseWhy },
    { key: "stats", label: "💪 种族值总和", score: statsScore, why: statsWhy },
    { key: "speed", label: "💨 速度线", score: speedScore, why: speedWhy }
  ];
  var weights = { offense: 0.35, defense: 0.30, stats: 0.20, speed: 0.15 };
  var detail = { cover: cover, superList: superList, gapList: gapList, weakByAtk: weakByAtk, atkTypes: atkTypes };

  if (foe && foe.length) {
    var foeTypes = teamAtkTypes(foe);
    var myPress = foe.reduce(function(s, p){ return s + bestMult(atkTypes, p.types); }, 0) / foe.length;
    var foePress = mine.reduce(function(s, p){ return s + bestMult(foeTypes, p.types); }, 0) / mine.length;
    var vs = Math.round(Math.max(0, Math.min(100, 50 + (myPress - foePress) * 50)));
    parts.push({ key: "vsfoe", label: "⚔️ 对敌压制", score: vs,
      why: "我方打敌方平均最高倍率 ×" + myPress.toFixed(2) + "，敌方反打我方平均 ×" + foePress.toFixed(2) + "。" +
        (myPress >= foePress ? "进攻端占优：尽量先手集火敌方被克制的精灵。" : "进攻端吃亏：敌方更容易克制我方，先想想换阵或补抗性。") });
    weights = { offense: 0.25, defense: 0.25, stats: 0.15, speed: 0.10, vsfoe: 0.25 };
    detail.myPress = myPress; detail.foePress = foePress;
  }
  var total = Math.round(parts.reduce(function(s, pt){ return s + pt.score * weights[pt.key]; }, 0));
  return { total: total, parts: parts, detail: detail };
}

function recommend(mine, foe){
  /* 遍历全图鉴：补入后总分提升最大的前 5 只，并生成人话理由 */
  var base = scoreTeam(mine, foe);
  var inTeam = {};
  mine.forEach(function(p){ inTeam[p.id] = 1; });
  var scored = [];
  DB.pets.forEach(function(cand){
    if (inTeam[cand.id]) return;
    var s = scoreTeam(mine.concat([cand]), foe);
    scored.push({ pet: cand, gain: s.total - base.total, after: s });
  });
  scored.sort(function(a, b){ return (b.gain - a.gain) || (b.pet.stats.total - a.pet.stats.total); });
  return scored.slice(0, 5).map(function(r){
    var newSuper = r.after.detail.superList.filter(function(d){ return base.detail.superList.indexOf(d) < 0; });
    var fixedGap = r.after.detail.gapList.filter(function(d){ return base.detail.gapList.indexOf(d) >= 0 && r.after.detail.gapList.indexOf(d) < 0; });
    var reasons = [];
    if (newSuper.length) reasons.push("补上后新增超效打击面：" + newSuper.join("、"));
    if (fixedGap.length) reasons.push("堵住半伤短板：对 " + fixedGap.join("、") + " 不再只能打 ×0.5");
    if (!reasons.length) {
      var dw = r.after.parts.filter(function(pt){ return pt.key === "defense"; })[0];
      var bw = base.parts.filter(function(pt){ return pt.key === "defense"; })[0];
      if (dw && bw && dw.score > bw.score) reasons.push("它的属性不怕全队最怕的攻击属性，能摊薄弱点重叠");
    }
    if (!reasons.length) reasons.push("种族值总和 " + r.pet.stats.total + "、速度 " + r.pet.stats.spe + "，拉升全队面板与速度线");
    reasons.push("综合评分 " + base.total + " → " + r.after.total);
    return { pet: r.pet, gain: r.gain, why: reasons.join("；") + "。" };
  });
}

(function loadTeam(){
  try {
    var raw = localStorage.getItem("roco-world-team-v1");
    if (!raw) return;
    var t = JSON.parse(raw);
    if (Array.isArray(t.mine)) team.mine = t.mine;   /* id 有效性等 DB 就绪后由 _restore 校验 */
    if (Array.isArray(t.foe)) team.foe = t.foe;
    team.foeOn = !!t.foeOn;
  } catch (e) { /* 忽略损坏的存档 */ }
})();
function saveTeam(){

  } catch (e) { /* 存储不可用时静默 */ }
}
(function restoreTeam(){
  /* DB 就绪后（buildIndex 之后）再校验存档里的 id */

    team.mine = team.mine.filter(function(id){ return DB.petById[id]; });

/* ============ 培养方案（#/train） ============ */
/* 推荐模型（本站规则生成、非官方攻略，全部引用真实数据）：
   - 携带技能：候选 = learnset 三组（等级/技能石/血脉）去重并集。攻击招按
     「有效威力 = 威力 × 本系加成 1.2 × 攻项匹配度（该招对应攻项 ÷ 双攻较高项）」
     排序，先保 1–2 招本系主攻；第 3 招补打击面（能 ×2 打中「克制本精灵的属性」
     记 3 分/个、新覆盖属性记 1 分/个）；第 4 招优先 desc 带回复/护盾/强化等
     关键词的变化类辅助招，没有合适的用次优攻击招补齐。
   - 性格：按种族值画像先定 +/− 组合，再去 natures.json 查名（数据来自 BWIKI
     模块:Natures/data，共 30 种，每种一项 +10%、一项 −10%，含生命项）。
     高速输出（速度 ≥95 且主攻 ≥90）→ +速度 −废攻；慢速输出（速度 <70）→
     +主攻 −速度；中速输出 → +主攻 −废攻；坦克（双攻都 <95 且双防/体力突出）
     → +较高防 −较低攻。主推与备选各一。
   - 血脉：候选 = learnset.bloodline 每条（条目自带血脉系别），按其技能属性的
     反打价值（×2 克制几个威胁属性）×3 + 新增打击面数 + 威力/100 打分。
     改血脉只多学一个该系技能（15 级解锁），不改变自身属性与被克制关系。
   - 个体值：按画像给主攻/速度/生存打分取前三项。 */
var train = { petId: null };
var STATUS_WORDS = ["回复", "恢复", "治疗", "回血", "护盾", "减伤", "强化", "提升", "增益", "聚能", "吸血", "免疫", "净化", "降低"];
var STAT_NAME = { hp: "生命", atk: "物攻", def: "物防", spa: "魔攻", spd: "魔防", spe: "速度" };

function petPool(pet){
  /* learnset 三组去重并集，保留来源（等级 > 技能石 > 血脉的顺序标注） */
  var seen = {}, out = [];
  var ls = pet.learnset || { level: [], stone: [], bloodline: [] };
  function add(name, src, bloodType){
    if (!name || seen[name]) return;
    seen[name] = 1;
    var sk = skillOf(name);
    if (!sk || sk.category === "特性") return;
    out.push({ skill: sk, src: src, bloodType: bloodType || null });
  }
  (ls.level || []).forEach(function(x){ add(x.skill, "level"); });
  (ls.stone || []).forEach(function(n){ add(n, "stone"); });
  (ls.bloodline || []).forEach(function(b){ add(b.skill, "blood", b.type); });
  return out;
}
function effPower(pet, sk){
  if (sk.power == null || (sk.category !== "物理" && sk.category !== "魔法")) return 0;
  var main = Math.max(pet.stats.atk, pet.stats.spa);
  var mine = sk.category === "物理" ? pet.stats.atk : pet.stats.spa;
  var match = main > 0 ? mine / main : 1;
  var stab = pet.types.indexOf(sk.type) >= 0 ? 1.2 : 1;
  return sk.power * stab * match;
}
function natureOf(plus, minus){
  for (var i = 0; i < DB.natures.length; i++) {
    var n = DB.natures[i];
    if (n.plus === plus && n.minus === minus) return n;
  }
  return null;
}

function buildCard(pet){
  var st = pet.stats;
  var pool = petPool(pet);
  var mainSide = st.atk >= st.spa ? "物理" : "魔法";
  var mainKey = st.atk >= st.spa ? "atk" : "spa";
  var offKey = mainKey === "atk" ? "spa" : "atk";
  var threats = TYPES18.filter(function(a){ return typeMult(a, pet.types) > 1; });

  /* ---- 携带技能 ×4 ---- */
  var atkPool = pool.filter(function(e){
    return e.skill.power != null && (e.skill.category === "物理" || e.skill.category === "魔法");
  }).map(function(e){ return { e: e, eff: effPower(pet, e.skill) }; })
    .sort(function(a, b){ return b.eff - a.eff; });
  var moves = [], usedName = {};
  function take(entry, why){
    moves.push({ skill: entry.e.skill, src: entry.e.src, bloodType: entry.e.bloodType, why: why });
    usedName[entry.e.skill.name] = 1;
  }
  function free(list){ return list.filter(function(x){ return !usedName[x.e.skill.name]; }); }

  free(atkPool).filter(function(x){
    return pet.types.indexOf(x.e.skill.type) >= 0 && x.e.skill.category === mainSide;
  }).slice(0, 2).forEach(function(x, i){
    take(x, i === 0
      ? "本系" + mainSide + "主攻：威力 " + x.e.skill.power + "，吃本系加成 ×1.2，有效威力 " + Math.round(x.eff) + "，是它输出的核心"
      : "第二招本系输出：威力 " + x.e.skill.power + "、能耗 ★" + (x.e.skill.energy != null ? x.e.skill.energy : "—") + "，与主攻招错开能耗，保证本系火力不断档");
  });
  if (moves.length < 2) {
    free(atkPool).slice(0, 2 - moves.length).forEach(function(x){
      take(x, "本系" + mainSide + "招不够，先用有效威力最高的攻击招顶上：威力 " + x.e.skill.power + "、有效威力 " + Math.round(x.eff));
    });
  }
  if (moves.length < 4) { /* 第 3 招：补打击面 / 反打弱点 */
    var covered = {};
    moves.forEach(function(m){
      TYPES18.forEach(function(d){ if (typeMult(m.skill.type, [d]) >= 2) covered[d] = 1; });
    });
    var bestCov = null;
    free(atkPool).forEach(function(x){
      var t = x.e.skill.type;
      var counter = threats.filter(function(a){ return typeMult(t, [a]) >= 2; });
      var fresh = TYPES18.filter(function(d){ return typeMult(t, [d]) >= 2 && !covered[d]; });
      var score = counter.length * 3 + fresh.length + x.eff / 100;
      if (!bestCov || score > bestCov.score) bestCov = { x: x, score: score, counter: counter, fresh: fresh };
    });
    if (bestCov && (bestCov.counter.length || bestCov.fresh.length)) {
      var bits = [];
      if (bestCov.counter.length) bits.push("反打弱点：" + bestCov.x.e.skill.type + "系 ×2 克制 " + bestCov.counter.join("、") + "，正是克制" + pet.types.join("/") + "系的属性");
      if (bestCov.fresh.length) bits.push("补打击面：新覆盖 " + bestCov.fresh.join("、"));
      take(bestCov.x, bits.join("；"));
    }
  }
  if (moves.length < 4) { /* 第 4 招：状态/辅助 */
    var bestStatus = null;
    pool.forEach(function(e){
      if (usedName[e.skill.name] || e.skill.category !== "变化") return;
      var hits = STATUS_WORDS.filter(function(w){ return (e.skill.desc || "").indexOf(w) >= 0; });
      if (hits.length && (!bestStatus || hits.length > bestStatus.hits.length)) bestStatus = { e: e, hits: hits };
    });
    if (bestStatus) {
      var d0 = (bestStatus.e.skill.desc || "").split(/[。；]/)[0];
      take({ e: bestStatus.e }, "辅助位：带「" + bestStatus.hits.join("、") + "」效果——" + d0);
    }
  }
  while (moves.length < 4) {
    var rest = free(atkPool);
    if (!rest.length) break;
    take(rest[0], "输出补位：威力 " + rest[0].e.skill.power + "，有效威力 " + Math.round(rest[0].eff) + "，是剩余攻击招里最能打的一招");
  }

  /* ---- 性格推荐 ---- */
  var isTank = st.atk < 95 && st.spa < 95 && (st.def >= 100 || st.spd >= 100 || st.hp >= 120);
  function natPick(plus, minus, why){
    var n = natureOf(plus, minus);
    return n ? { name: n.name, plus: plus, minus: minus, why: why } : null;
  }
  var natMain = null, natAlt = null;
  if (isTank) {
    var hiDef = st.def >= st.spd ? "def" : "spd";
    var loAtk = st.atk <= st.spa ? "atk" : "spa";
    natMain = natPick(hiDef, loAtk, "它双攻都不高（物攻 " + st.atk + " / 魔攻 " + st.spa + "），靠" + STAT_NAME[hiDef] + " " + st[hiDef] + " 和体力 " + st.hp + " 站场：加" + STAT_NAME[hiDef] + "让它更扛揍，减掉" + STAT_NAME[loAtk] + "（" + st[loAtk] + "）几乎没损失");
    natAlt = natPick("hp", loAtk, "备选加生命：把体力 " + st.hp + " 再堆高更耐久，一样减掉用不上的" + STAT_NAME[loAtk]);
  } else if (st.spe >= 95 && st[mainKey] >= 90) {
    natMain = natPick("spe", offKey, "速度 " + st.spe + "、" + STAT_NAME[mainKey] + " " + st[mainKey] + "，是高速输出型：加速度抢先手，减掉用不上的" + STAT_NAME[offKey] + "（只有 " + st[offKey] + "）");
    natAlt = natPick(mainKey, offKey, "备选加" + STAT_NAME[mainKey] + "堆一击伤害，同样减" + STAT_NAME[offKey] + "，适合不缺先手的场合");
  } else if (st.spe < 70) {
    natMain = natPick(mainKey, "spe", "速度只有 " + st.spe + "，抢先手没指望，干脆加" + STAT_NAME[mainKey] + "（" + st[mainKey] + "）堆一击伤害，减速度不心疼");
    natAlt = natPick(mainKey, offKey, "备选同样加" + STAT_NAME[mainKey] + "，但减" + STAT_NAME[offKey] + "保住速度，怕被同速线压制时用这个");
  } else {
    natMain = natPick(mainKey, offKey, "中速输出型：主攻" + STAT_NAME[mainKey] + " " + st[mainKey] + " 是饭碗，先把它堆满，减掉几乎不用的" + STAT_NAME[offKey] + "（" + st[offKey] + "）");
    natAlt = natPick("spe", offKey, "备选加速度（现在 " + st.spe + "），抢一档先手，一样减" + STAT_NAME[offKey] + "，适合速度线吃紧的队伍");
  }

  /* ---- 改血脉推荐 ---- */
  var poolTypes = petAtkTypes(pet);
  var bloods = [];
  ((pet.learnset && pet.learnset.bloodline) || []).forEach(function(b){
    var sk = skillOf(b.skill);
    if (!sk || sk.category === "特性") return;
    var t = b.type || sk.type;
    var counter = threats.filter(function(a){ return typeMult(t, [a]) >= 2; });
    var fresh = TYPES18.filter(function(d){ return typeMult(t, [d]) >= 2 && bestMult(poolTypes, [d]) < 2; });
    var score = counter.length * 3 + fresh.length + (sk.power || 0) / 100 +
      (pet.types.indexOf(t) >= 0 ? 0.5 : 0);
    bloods.push({ type: t, skill: sk, score: score, counter: counter, fresh: fresh });
  });
  bloods.sort(function(a, b){ return b.score - a.score; });
  var bloodTop = bloods.slice(0, 2).map(function(b, i){
    var bits = [];
    if (b.counter.length) bits.push(b.type + "系 ×2 克制 " + b.counter.join("、") + "——全是克制" + pet.types.join("/") + "系的属性，对位时能反手打回去");
    if (b.fresh.length) bits.push("补上新打击面 " + b.fresh.slice(0, 4).join("、") + (b.fresh.length > 4 ? " 等 " + b.fresh.length + " 种" : ""));
    if (pet.types.indexOf(b.type) >= 0) bits.push("与本系相同，解锁的技能吃本系加成 ×1.2");
    if (!bits.length) bits.push("在它的血脉技能里综合价值最高（" + b.skill.category + (b.skill.power != null ? " · 威力 " + b.skill.power : "") + "）");
    return { type: b.type, skill: b.skill, why: bits.join("；") };
  });

  /* ---- 个体值优先 ---- */
  var ivScore = { atk: 0, spa: 0, spe: 0, hp: 0, def: 0, spd: 0 };
  ivScore[mainKey] = 100;
  ivScore.spe = st.spe >= 90 ? 90 : st.spe >= 70 ? 60 : st.spe >= 50 ? 35 : 15;
  ivScore.hp = st.hp >= 120 ? 70 : st.hp >= 95 ? 55 : 40;
  ivScore.def = st.def >= 110 ? 50 : st.def >= 90 ? 30 : 10;
  ivScore.spd = st.spd >= 110 ? 50 : st.spd >= 90 ? 30 : 10;
  if (isTank) { ivScore.def += 30; ivScore.spd += 30; ivScore.hp += 10; }
  var ivWhy = {};
  ivWhy[mainKey] = "主攻项，决定输出上限";
  ivWhy[offKey] = "副攻项，基本不用";
  ivWhy.spe = "速度 " + st.spe + "，决定出手顺序";
  ivWhy.hp = "体力 " + st.hp + "，站场资本";
  ivWhy.def = "物防 " + st.def + "，扛物理伤害";
  ivWhy.spd = "魔防 " + st.spd + "，扛魔法伤害";
  var ivOrder = ["atk", "spa", "spe", "hp", "def", "spd"];
  var ivs = ivOrder.slice().sort(function(a, b){
    return (ivScore[b] - ivScore[a]) || (ivOrder.indexOf(a) - ivOrder.indexOf(b));
  }).slice(0, 3).map(function(k){ return { key: k, label: STAT_NAME[k], why: ivWhy[k] }; });

  return { moves: moves, natMain: natMain, natAlt: natAlt, bloods: bloodTop, ivs: ivs, isTank: isTank };
}
